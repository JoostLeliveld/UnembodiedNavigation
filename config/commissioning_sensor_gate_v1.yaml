# Prospective deterministic sensor gate for reference-controlled commissioning.
#
# This gate defines the Bernoulli event learned as q_sensor: the fixed detector
# produced a box and the box passed deterministic, belief-independent sensor checks.
# NIS, data association, tracking, and localizer acceptance occur downstream and
# are deliberately forbidden here. Freeze and hash this file before collection.

gate_id: commissioning_sensor_gate_v1

# warehouse_v2 fixed-camera image geometry.
image_width_px: 1280
image_height_px: 720

# The opportunity logger already records one row per delivered physical frame. Frame
# transport health is reported separately until a trustworthy per-frame age is logged.
check_frame_freshness: false
max_frame_age_ms: 500.0

# Fixed deployed detector threshold and raw-box support checks.
check_confidence: true
confidence_threshold: 0.25
check_class: false
expected_class: null
check_box_size: true
min_bbox_width_px: 16.0
min_bbox_height_px: 16.0
check_projection: true
check_edge_clip: true
min_edge_distance_px: 4.0

# These are estimator/belief decisions, not sensor-gate inputs.
check_association: false
require_track: false
check_localizer_accept: false
