tasks:
  warehouse_aws.world.sdf:
  - name: route_apron_to_a3_mid
    description: >
      Route-choice benchmark from the visible A4 apron to the A3 mid cross-aisle.
      The short northern route passes through weaker camera reliability near the
      rack tops; the southern sweep stays in the open apron.
    tier: paper
    claim: visibility_route_choice
    focus: apron_to_a3_visibility_tradeoff
    start:
      x: 3.3
      y: -1.0
      z: 0.05
      yaw: 0.0
    goal:
      x: 1.0
      y: 1.75

  - name: route_apron_to_a2_mid
    description: >
      Stronger route-choice benchmark from the visible A4 apron to the A2 mid
      cross-aisle. The short route traverses the camera-poor A4/A3 northern
      gap, while the visible detour runs south through the apron and up A2.
    tier: paper
    claim: visibility_route_choice
    focus: severe_occlusion_long_shortcut
    start:
      x: 3.3
      y: -1.0
      z: 0.05
      yaw: 0.0
    goal:
      x: -1.0
      y: 1.75

  - name: route_west_to_a1_upper
    description: >
      West-side route-choice benchmark from the visible west service lane to the
      upper A1 aisle. The short route crosses camera-poor west/upper space; the
      southern detour stays in better observed lanes.
    tier: paper
    claim: visibility_route_choice
    focus: west_side_route_choice
    start:
      x: -5.25
      y: -0.75
      z: 0.05
      yaw: 0.0
    goal:
      x: -3.0
      y: 3.5

  - name: control_west_to_a1_low
    description: >
      Visible-control benchmark from the west service lane to the lower A1 aisle.
      Both conditions should prefer the same visible lower route and reach the goal.
    tier: paper
    claim: no_spurious_detour
    focus: visible_control
    start:
      x: -5.25
      y: -0.75
      z: 0.05
      yaw: 0.0
    goal:
      x: -3.0
      y: -0.75

  - name: sanity_visible_apron_crossing
    description: >
      Simple visible-lane sanity check across the lower apron. Use this to
      verify simulator, detector, and state-estimation wiring before running a
      route-choice campaign.
    tier: sanity
    claim: null
    focus: visible_sanity
    start:
      x: -4.25
      y: -3.15
      z: 0.05
      yaw: 0.0
    goal:
      x: 3.45
      y: -3.15
