tasks:
  warehouse_occ_light.world.sdf:
    # Recommended evaluation ladder for the thesis.
    # These tasks are organized by claim:
    # - sanity and threshold behavior near the front-side basin
    # - commitment to the visible front arc
    # - observability tradeoff in lower-visibility south-side regions
    # - recovery and clearance robustness
    - name: E0_visible_sanity
      description: Main benchmark task. Very short visible sanity-check run used to verify nominal stability, perception, state estimation, and basic planner progress in the open north-west corner.
      tier: benchmark
      claim: nominal_stability
      focus: visible_sanity
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: -1.2, y: 1.1}
    - name: E1_front_threshold_pre
      description: Diagnostic task. Approaches the west end of the long shelf from the north-west start before any full crossover decision is required.
      tier: diagnostic
      claim: threshold_sanity
      focus: pre_basin_threshold
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: -0.9, y: 0.95}
    - name: E2_front_threshold_post
      description: Main benchmark task. Sits just beyond the west end of the shelf and tests whether the planner can get around the obstacle without yet committing to the long eastward traverse.
      tier: benchmark
      claim: local_commitment
      focus: post_basin_threshold
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: -0.4, y: 0.95}
    - name: E3_front_arc_mid
      description: Diagnostic task. Requires commitment to the north-side lane past the shelf, but stops before the far east side so the route choice can be isolated from full-route endurance.
      tier: diagnostic
      claim: arc_commit_debug
      focus: visible_arc_commit
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.7, y: 0.95}
    - name: E4_front_arc_full
      description: Main benchmark task. Full north-side route past the shelf, used as a same-side reference traverse before the crossover-heavy tasks.
      tier: benchmark
      claim: route_preference
      focus: visible_reference
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: 1.7, y: 1.05}
    - name: E5_shadow_tradeoff
      description: Main benchmark task. Starts north-west and asks the planner to reach the south-east goal, forcing a choice between the shorter but more occluded camera-left crossover and the longer clearer camera-right route.
      tier: benchmark
      claim: shadow_tradeoff
      focus: visibility_tradeoff
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: 1.55, y: -1.45}
    - name: E6_shadow_reacquire
      description: Diagnostic task. Stays north of the shelf longer and then re-emerges on the east-south side, reserved for missed-detection and reacquisition checks after the main route-choice tests are stable.
      tier: diagnostic
      claim: reacquisition_debug
      focus: detection_reacquisition
      start: {x: -2.0, y: 1.4, z: 0.05, yaw: 0.0}
      goal: {x: 1.5, y: -0.35}
    - name: E7_clearance_probe
      description: Diagnostic task. South-side pass close to the shelf footprint, reserved for no-go tuning and obstacle-clearance behavior separate from the crossover route-choice tasks.
      tier: diagnostic
      claim: clearance_debug
      focus: obstacle_clearance
      start: {x: -2.0, y: -1.8, z: 0.05, yaw: 0.0}
      goal: {x: 0.8, y: -0.9}

  warehouse_open_shelves.world.sdf:
    # Secondary support world. These tasks are intentionally smaller in number than the
    # primary benchmark ladder and focus on transfer to a gap-commitment layout.
    - name: OS0_upper_gap_sanity
      description: Support task. Sanity-check run on the north side of the segmented shelf world, used to verify stable progress before the stronger gap-commitment routes.
      tier: exploratory
      claim: open_gap_sanity
      focus: upper_gap_crossing
      start: {x: -2.3, y: 1.7, z: 0.05, yaw: 0.0}
      goal: {x: 1.7, y: 1.55}
    - name: OS1_lower_gap_commit
      description: Support task. Starts north-west and asks the planner to commit through the shorter camera-left crossing instead of drifting toward the longer clearer camera-right alternative.
      tier: exploratory
      claim: gap_selection
      focus: lower_gap_commit
      start: {x: -2.3, y: 1.7, z: 0.05, yaw: 0.0}
      goal: {x: 1.55, y: -1.75}
    - name: OS2_partial_occlusion_peek
      description: Support task. Finishes in the east-middle lane after passing the segmented shelf line, useful for checking post-gap reacquisition and route completion.
      tier: exploratory
      claim: visibility_reacquisition
      focus: east_lane_reacquire
      start: {x: -2.3, y: 1.7, z: 0.05, yaw: 0.0}
      goal: {x: 1.45, y: -0.20}
