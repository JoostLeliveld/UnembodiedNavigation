tasks:
  warehouse_occ_light.world.sdf:

    # Task A — primary shadow-tradeoff task.
    # Start visible (y=0.5, west of shelf). Goal at y=-0.5, east/south of shelf.
    # Direct path crosses the reduced camera-update region near the shelf.
    # Visible detour drops farther below the shelf before returning to the goal.
    # VERIFY before running: rho_plan(-2,0.5), rho_plan(2,-0.5), shadow on direct path,
    # and robot clearance along the lower detour.
    - name: shadow_tradeoff_a
      description: >
        Primary shadow-tradeoff task. Start at y=0.5 (west of shelf).
        Goal at y=-0.5 (south of shelf, moderate visibility).
        The direct path crosses the camera shadow zone.
      tier: benchmark
      claim: shadow_tradeoff
      focus: visibility_tradeoff
      start: {x: -2.0, y: 0.5, z: 0.05, yaw: 0.0}
      goal:  {x: 2.0, y: -0.5}

    # Task A-left — exploratory start farther west.
    # This keeps the same shelf/goal geometry as Task A, but gives the planner
    # more approach distance before the shadow. The lower visible route is less
    # path-length-expensive relative to the direct route from this start.
    - name: shadow_tradeoff_a_leftstart
      description: >
        Exploratory Task A variant. Start at x=-2.5, y=0.5, with the same
        goal as Task A. Used to test whether extra approach distance helps the
        visibility-aware objective commit to the lower visible route.
      tier: exploratory
      claim: shadow_tradeoff
      focus: visibility_tradeoff_start_sensitivity
      start: {x: -2.5, y: 0.5, z: 0.05, yaw: 0.0}
      goal:  {x: 2.0, y: -0.5}

    # Task A-close-goal — same world / same GP, but the goal sits closer to the
    # shelf so the robot has less post-shadow distance to recover after a direct
    # blind crossing. This keeps the environment fixed while strengthening the
    # consequence of stale updates.
    - name: shadow_tradeoff_a_goalclose
      description: >
        Exploratory Task A variant with the goal moved closer to the shelf on
        the east side. Intended to preserve the same world and visibility field
        while making a shadow-cutting route less forgiving.
      tier: exploratory
      claim: shadow_tradeoff
      focus: visibility_tradeoff_goal_sensitivity
      start: {x: -2.0, y: 0.5, z: 0.05, yaw: 0.0}
      goal:  {x: 1.7, y: -0.25}

    # Task B — rotated shadow-tradeoff task.
    # Start at y=-1.0 and goal at y=-0.5. Tests the same shelf region from a
    # different approach angle.
    # VERIFY before running: rho_plan(-2,-1.0), rho_plan(2,-0.5), shadow on direct path.
    - name: shadow_tradeoff_b
      description: >
        Rotated shadow-tradeoff task. Start south of shelf at y=-1.0.
        Goal at y=-0.5. The direct diagonal crosses the shadow zone.
      tier: benchmark
      claim: shadow_tradeoff
      focus: visibility_tradeoff
      start: {x: -2.0, y: -1.0, z: 0.05, yaw: 0.7854}
      goal:  {x: 2.0, y: -0.5}

    # Task S — sanity check (no shadow involvement).
    # Entire path stays below the shelf in high-rho_plan territory.
    # C1 and C2 should produce nearly identical paths. Any significant divergence
    # indicates a bug or spurious GP signal in the visible region.
    - name: sanity_open
      description: >
        Sanity check task. Both start and goal are well below the shelf in the
        high-reliability visible region. C1 and C2 should behave identically.
      tier: sanity
      claim: null
      focus: sanity
      start: {x: -2.0, y: -1.5, z: 0.05, yaw: 0.0}
      goal:  {x: 2.0, y: -1.5}

    # Legacy task kept for reference. Geometry does NOT produce a forced tradeoff:
    # the goal is already below the shelf so the visible detour costs no extra distance.
    # Do NOT use for the IWAI campaign comparison.
    - name: main_shadow_tradeoff
      description: >
        Legacy benchmark task (pre-IWAI geometry). Start on northwest approach,
        goal at southeast. The goal position at y=-1.0 is already below the shelf,
        so both routes have similar length — no strong shadow tradeoff is forced.
        Retained for reference only.
      tier: legacy
      claim: null
      focus: legacy
      start: {x: -2.0, y: 1.0, z: 0.05, yaw: 0.0}
      goal:  {x: 2.0, y: -1.0}

  warehouse_occ_longshadow.world.sdf:

    # Long-shadow Task A — proposed follow-up benchmark to make C2 more useful.
    # The extra upper obstacle keeps the short northern crossover blind for longer
    # and narrows its clearance. The lower route stays open but moderately longer.
    - name: shadow_tradeoff_a_longshadow
      description: >
        Task A variant in the long-shadow world. Same start/goal family as the
        main benchmark, but an added upper-route obstacle extends the reduced-
        visibility shortcut and makes stale-update drift more consequential.
      tier: exploratory
      claim: shadow_tradeoff
      focus: visibility_tradeoff_robustness
      start: {x: -2.0, y: 0.5, z: 0.05, yaw: 0.0}
      goal:  {x: 2.0, y: -0.5}

    # Slightly farther goal to increase the payoff of committing to the lower
    # visible corridor instead of trying to squeeze through the blind shortcut.
    - name: shadow_tradeoff_a_longshadow_far
      description: >
        Long-shadow Task A variant with a slightly farther goal. Intended to
        stretch the post-shadow segment so a poor blind-route commitment has
        longer to hurt before the robot can recover.
      tier: exploratory
      claim: shadow_tradeoff
      focus: visibility_tradeoff_robustness
      start: {x: -2.0, y: 0.5, z: 0.05, yaw: 0.0}
      goal:  {x: 2.35, y: -0.45}

  warehouse_aws.world.sdf:

    # B1-visible: first AWS stability gate.
    # The final goal is deliberately in a planner-visible A4-side handoff
    # region. This checks base world/perception/planner stability without
    # asking the visibility-aware objective to terminate inside a camera-dark
    # region. No intermediate waypoint is used.
    - name: B1_visible_goal_smoke
      description: >
        Simple AWS visible-goal smoke task. The robot starts in the south
        shipping/apron lane near the A3/A4 fork and must reach a visible
        A4-side handoff target before the R4-stack shadow. This is a
        stability gate for the redesigned AWS world, not paper evidence for
        route-choice behavior.
      tier: smoke
      claim: aws_stability_visible_goal
      focus: stable_goal_reaching_visible_goal
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 3.25, y: -2.10}

    # B1: primary AWS/JDeRobot-style route-choice task.
    # Start is in the shipping/apron decision lane. The short route enters A4
    # immediately and passes behind the R4 lane-side stack. The neighboring A3
    # route is modestly longer and crosses back at the mid cross-aisle. No
    # intermediate waypoint is used for the benchmark: route choice must emerge
    # from the planner objective rather than the mission script.
    - name: B1_clean_route_choice
      description: >
        B1 primary AWS route-choice task. The robot starts in the south
        shipping/apron lane near the A3/A4 fork and must reach G_pick_A at the
        A4-side mid cross-aisle. The short A4 route is physically driveable but
        passes behind the R4 high stack. The A3 route is a modest detour through
        the neighboring visible aisle before crossing back to the same pick
        target.
      tier: benchmark
      claim: visibility_route_choice
      focus: visibility_tradeoff_route_choice
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 3.25, y: 1.72}

    # Alias with the explicit A4-vs-A3 name, kept so older configs can target
    # the route-choice version without inheriting the old over-long detour.
    - name: B1_a4_vs_a3
      description: >
        Explicit A4-vs-A3 version of B1. The short route enters A4 from the
        shipping/apron lane and passes behind the R4 high stack; the alternate
        route enters A3, stays more observable, and crosses back through the
        mid cross-aisle.
      tier: benchmark
      claim: visibility_route_choice
      focus: visibility_tradeoff_route_choice
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 3.25, y: 1.72}

    # B1 v2 — discriminating-regime task for the AWS world v2 (2026-05-20 redesign).
    # World changes vs. v1: R4 stack flush + widened to 0.55 m base; R4 rack body
    # shifted 0.10 m west; A4 widened to 1.10 m; camera lowered to z=4.5. Goal at
    # x=3.0 (A4-centerline column) instead of x=3.25 (slightly east of A4
    # centerline) so the short A4 route's shadow exposure is uniform across width.
    # See logs/visibility_comparison/rollouts/20260520_204144_world_v2_design/proposal.md.
    - name: B1_clean_route_choice_v2
      description: >
        v2 discriminating-regime task. South-east apron start; A4-side
        mid_cross_aisle goal in open visible terrain. Shortest route is up A4
        (through the R4 stack shadow). Visible alternative is up A3 then east
        via mid_cross_aisle (+~2 m). C1 should take A4 shortcut; C2 should
        detour via A3.
      tier: exploratory
      claim: visibility_route_choice_v2
      focus: visibility_tradeoff_route_choice_v2
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 3.00, y: 1.72}

    - name: B1_north_goal_v2
      description: >
        v2 stress test. Same start; goal pushed further north into
        upper_cross_aisle so the shadowed A4 leg is longer and the visible
        detour cost grows. Should show a stronger C1-vs-C2 contrast.
      tier: exploratory
      claim: visibility_route_choice_v2
      focus: visibility_tradeoff_route_choice_v2_stress
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 3.00, y: 4.55}

    # B2: secondary reacquisition stress task.
    - name: B2_reacquire_after_occlusion
      description: >
        B2 secondary stress task. The robot starts at S_rack_south on the west
        service lane and must reach G_shadow_exit in the mid cross-aisle. The
        path passes through the R4-stack shadow and then exits into a more
        observable reacquisition area.
      tier: exploratory
      claim: relocalize_before_dispatch
      focus: reacquire_after_occlusion
      start: {x: -4.85, y: -1.55, z: 0.05, yaw: 0.0}
      goal:  {x: 1.35, y: 1.72}

    # B3: secondary long-horizon far-corner stress task.
    - name: B3_long_horizon_far_corner
      description: >
        B3 secondary stress task. The robot starts at S_apron_right in the
        dispatch apron and must reach G_far_rack near the far north-east rack
        endpoint. This creates a longer route with far-camera perspective,
        sparse coverage risk, and a realistic main-aisle to rack-aisle
        transition.
      tier: exploratory
      claim: relocalize_before_dispatch
      focus: long_horizon_far_corner
      start: {x: 2.15, y: -3.15, z: 0.05, yaw: 1.5708}
      goal:  {x: 4.85, y: 4.55}

    # Round-3 diagnostic task in the simplified AWS world (R4 high stack
    # removed, aws_gp_v5). Start in A4 apron at (3,-1) — now visible per
    # v5 GP (P_conservative=0.74; was 0.004 before stack removal). Goal in
    # A3 at south edge of mid_cross_aisle (1, 2) — visible (P=0.50). The
    # direct east-west path is blocked by the R4 LOWER rack body, so the
    # planner must detour either north up A4 (partially shadowed by R4
    # lower rack at x=2 between y=0 and y=1) or south via the apron then
    # up A3 (fully visible). Used to diagnose whether the wavy half-circle
    # plan behavior persists when the R4-stack shadow is no longer driving
    # the optimisation.
    - name: B1_apron_a4_to_uppermid_a3
      description: >
        Diagnostic task in the simplified AWS world (R4 high stack removed,
        aws_gp_v5). Start in A4 apron (3, -1), goal at south edge of
        mid_cross_aisle in A3 (1, 2). Direct east-west blocked by R4 lower
        rack body; planner must detour either north via mid_cross_aisle or
        south via apron and A3.
      tier: diagnostic
      claim: null
      focus: planner_smoothness_diagnostic
      start: {x: 3.00, y: -1.00, z: 0.05, yaw: 1.5708}
      goal:  {x: 1.00, y: 2.00}

    # Round-1 cross-aisle visibility showcase (II-A reformulation).
    # Start (3.0, -2.5) in the south apron is camera-visible (P_GP=0.87) so
    # the EKF can bootstrap. Goal (1.0, 0.5) in A3 is also visible (P=0.68).
    # The "short" route is up A4 from the apron (~3 m north) which crosses
    # the R4-stack shadow band in the A4 aisle at x≥2.5 (P~0 for the whole
    # north-east quadrant per the empirical GP). The visible alternative is
    # west across the apron then up A3 (~5 m). C1 should take the shorter
    # shadowed path and drift; C2 should detour via the visible apron/A3
    # corridor.
    - name: B1_a4_to_a3_aisle_shadow_cross
      description: >
        AWS apron-to-A3 cross-aisle move. Start in the south apron at the
        A3/A4 fork (visible). Goal in A3 at the lower-rack-row latitude
        (visible). Short route via A4 north passes through the R4-stack
        shadow band; visible detour goes west along the apron then north
        through A3.
      tier: exploratory
      claim: visibility_route_choice
      focus: visibility_tradeoff_cross_aisle
      start: {x: 3.00, y: -2.50, z: 0.05, yaw: 1.5708}    # facing north
      goal:  {x: 1.00, y: 0.50}

    # Sanity check: both planners should behave similarly in the visible south
    # apron and should not need the hidden aisle.
    - name: visible_aisle_sanity_aws
      description: >
        Southern apron sanity check in the clean AWS/JdeRobot section.
        Both start (-4.25,-3.15) and goal (3.45,-3.15) lie in the camera-visible
        open apron. This separates detector/GP readiness from the
        failure-consequence benchmark.
      tier: sanity
      claim: null
      focus: sanity
      start: {x: -4.25, y: -3.15, z: 0.05, yaw: 0.0}
      goal:  {x: 3.45, y: -3.15}
  warehouse_putaway.world.sdf:

    # ----- DISCRIMINATING regime -----------------------------------------------
    # Inbound scan/QC pickup A -> rear-lane put-away handoff B. Both A and B
    # sit in camera-visible terrain. The direct rear lane is shorter but the
    # staging stacks occlude the central-south camera's view of the robot along it.
    # C1 should take the rear lane (geometry-only); C2 should detour via the
    # front lane (visibility-aware). A is placed slightly east of the far-left
    # wall so the detector has a valid initial observation.
    - name: shadow_tradeoff_putaway_discriminating
      description: >
        Discriminating-regime task for warehouse_putaway. South-west scan/QC
        pickup A (-3.8, -2.0) to rack-side put-away handoff bay B
        (4.2, 1.25). Both A and B are camera-visible. Rear (north) lane is
        shorter but shadowed by the inbound staging stacks. Front (south)
        circulation lane is the visible detour around the known staging island.
      tier: benchmark
      claim: shadow_tradeoff
      focus: visibility_tradeoff_putaway
      start: {x: -3.80, y: -2.00, z: 0.05, yaw: 0.7854}     # yaw = pi/4 (NE)
      goal:  {x: 4.20, y: 1.25}

    # ----- EASY regime (sanity check) ------------------------------------------
    # A -> outbound dock (front of staging). Both routes are visible; the rear
    # lane offers no advantage. C1 and C2 should produce nearly identical paths.
    - name: shadow_tradeoff_putaway_easy
      description: >
        Easy / sanity task for warehouse_putaway. Pickup A (-3.8, -2.0) to
        outbound dock return point (5.0, -2.3). Both routes stay in the camera-
        visible front-lane region. C1 and C2 should produce identical paths.
        Significant divergence indicates a bug or spurious GP signal.
      tier: sanity
      claim: null
      focus: sanity
      start: {x: -3.80, y: -2.00, z: 0.05, yaw: 0.0}
      goal:  {x: 5.00, y: -2.30}

    # ----- HARD regime (safe-stop) ---------------------------------------------
    # A -> goal deep inside the rear-lane shadow. No visible path to the goal.
    # C2 should refuse to enter the shadow and stop safely; C1 may push through
    # and lose track. Per project_thesis_stability_claim.md.
    - name: shadow_tradeoff_putaway_hard
      description: >
        Hard / safe-stop task for warehouse_putaway. Pickup A (-3.8, -2.0) to
        a rack-internal drop point (0.5, 2.4) deep inside the staging shadow.
        No fully visible path to the goal. C2 should refuse to enter shadow
        and stop safely; C1 may risk a blind traversal. The thesis stability
        claim: not reaching this goal in C2 is a SUCCESS outcome, not a failure.
      tier: benchmark
      claim: visibility_safe_stop
      focus: visibility_safe_stop_putaway
      start: {x: -3.80, y: -2.00, z: 0.05, yaw: 1.5708}     # yaw = pi/2 (N)
      goal:  {x: 0.50, y: 2.40}

  parcel_sortation.world.sdf:

    # Sortation route-choice gate.
    # The direct rear lane is physically open but passes behind the central
    # inbound parcel stacks. The front lane is longer but camera-side. No
    # intermediate waypoints are used; C1/C2 receive the same start, goal, and
    # known forbidden-zone layer.
    - name: shadow_tradeoff_sortation_discriminating
      description: >
        Parcel-sortation route-choice task. The robot starts at the west
        induction pickup bay and must reach the east sort-wall handoff bay.
        The short rear lane is physically driveable but expected to be less
        observable behind the inbound staging stacks; the front circulation
        lane is the longer visible alternative.
      tier: exploratory
      claim: shadow_tradeoff_extension
      focus: visibility_tradeoff_sortation
      start: {x: -3.40, y: 1.00, z: 0.05, yaw: 0.0}
      goal:  {x: 3.60, y: 1.00}

    # Visible-lane sanity check for the same sortation world.
    - name: shadow_tradeoff_sortation_front_sanity
      description: >
        Parcel-sortation sanity task from the west induction pickup bay to a
        camera-side front-lane target. Both planners should behave similarly
        once a parcel_sortation-specific GP exists.
      tier: sanity
      claim: null
      focus: sortation_visible_sanity
      start: {x: -3.40, y: 1.00, z: 0.05, yaw: -1.5708}
      goal:  {x: 3.60, y: -1.25}
