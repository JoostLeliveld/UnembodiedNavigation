tasks:
  warehouse_occ_light.world.sdf:
    # Recommended evaluation ladder for the thesis.
    # These tasks are organized by claim:
    # - sanity and threshold behavior near the front-side basin
    # - commitment to the visible front arc
    # - observability tradeoff in shadowed regions
    # - recovery and clearance robustness
    - name: E0_visible_sanity
      description: Main benchmark task. Very short visible sanity-check run used to verify nominal stability, perception, state estimation, and basic planner progress in a clearly observable region.
      tier: benchmark
      claim: nominal_stability
      focus: visible_sanity
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -3.3, y: 1.9}
    - name: E1_front_threshold_pre
      description: Diagnostic task. Stops before the known front-side local basin to verify that the planner can approach the rack while staying in the easy visible regime.
      tier: diagnostic
      claim: threshold_sanity
      focus: pre_basin_threshold
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -3.1, y: 1.7}
    - name: E2_front_threshold_post
      description: Main benchmark task. Sits just past the old front-side commit point and tests whether the planner can get beyond the basin without yet requiring the full eastward arc.
      tier: benchmark
      claim: local_commitment
      focus: post_basin_threshold
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -2.45, y: 1.45}
    - name: E3_front_arc_mid
      description: Diagnostic task. Requires commitment to the visible front arc, but stops before the far east side so the commitment problem can be isolated from full-route endurance.
      tier: diagnostic
      claim: arc_commit_debug
      focus: visible_arc_commit
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -1.2, y: 1.2}
    - name: E4_front_arc_full
      description: Main benchmark task. Full visible reference route that stays mostly in front of the rack and outside the strongest occlusion shadow, used as the route-level comparison task.
      tier: benchmark
      claim: route_preference
      focus: visible_reference
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.6, y: 1.2}
    - name: E5_shadow_tradeoff
      description: Main benchmark task. Starts in a visible north-west pose and asks the planner to reach the south-east goal that competes more directly with shadowed sensing conditions.
      tier: benchmark
      claim: shadow_tradeoff
      focus: visibility_tradeoff
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -0.8, y: -3.0}
    - name: E6_shadow_reacquire
      description: Diagnostic task. Crosses the shadowed region and then re-emerges on the east side, reserved for missed-detection and reacquisition experiments after the main route-choice tests are stable.
      tier: diagnostic
      claim: reacquisition_debug
      focus: detection_reacquisition
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.4, y: -0.6}
    - name: E7_clearance_probe
      description: Diagnostic task. South-side pass close to the rack footprint, reserved for no-go tuning and obstacle-clearance behavior separate from the front-side local basin.
      tier: diagnostic
      claim: clearance_debug
      focus: obstacle_clearance
      start: {x: -5.0, y: -3.8, z: 0.05, yaw: 0.0}
      goal: {x: -1.1, y: -0.8}

  warehouse_open_shelves.world.sdf:
    # Secondary exploratory world. These tasks are intentionally not part of the
    # single-map core thesis benchmark; they probe richer partial-occlusion use cases.
    - name: OS0_upper_gap_sanity
      description: Exploratory task. Crosses from the west-north start to the east-upper goal through the clearer upper shelf gap and serves as the nominal open-shelving sanity check.
      tier: exploratory
      claim: open_gap_sanity
      focus: upper_gap_crossing
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.9, y: 1.8}
    - name: OS1_lower_gap_commit
      description: Exploratory task. Starts north-west and asks the planner to commit to the lower gap to reach the east-lower goal instead of stalling at the west face of the shelves.
      tier: exploratory
      claim: gap_selection
      focus: lower_gap_commit
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.65, y: -2.3}
    - name: OS2_partial_occlusion_peek
      description: Exploratory task. Finishes just east of the shelving where the robot can either accept partial visibility behind the south bay or detour to a clearer gap first.
      tier: exploratory
      claim: partial_occlusion
      focus: partial_shadow_acceptance
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -0.2, y: -1.45}
    - name: OS3_dual_gap_route
      description: Exploratory task. Starts south-west and ends east-north, testing whether the planner threads one of the shelf openings or chooses a wider route around the segmented barrier.
      tier: exploratory
      claim: dual_gap_route_choice
      focus: gap_weaving
      start: {x: -5.0, y: -3.2, z: 0.05, yaw: 0.0}
      goal: {x: 0.9, y: 1.8}
    - name: OS4_east_mid_reacquire
      description: Exploratory task. Crosses behind the shelving and finishes in the east-middle lane, useful for studying visibility reacquisition after partial shielding.
      tier: exploratory
      claim: visibility_reacquisition
      focus: east_lane_reacquire
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 1.0, y: 0.1}
