tasks:
  warehouse_aws.world.sdf:
  - name: route_apron_to_a3_mid
    description: >
      Route-choice benchmark from the visible A4 apron to the A3 mid cross-aisle.
      The short northern route passes through weaker camera reliability near the
      rack tops; the southern sweep stays in the open apron.
    tier: paper
    claim: visibility_route_choice
    focus: apron_to_a3_visibility_tradeoff
    start:
      x: 3.3
      y: -1.0
      z: 0.05
      yaw: 0.0
    goal:
      x: 1.0
      y: 1.75

  - name: route_apron_to_a2_mid
    description: >
      Stronger route-choice benchmark from the visible A4 apron to the A2 mid
      cross-aisle. The short route traverses the camera-poor A4/A3 northern
      gap, while the visible detour runs south through the apron and up A2.
    tier: paper
    claim: visibility_route_choice
    focus: severe_occlusion_long_shortcut
    start:
      x: 3.3
      y: -1.0
      z: 0.05
      yaw: 0.0
    goal:
      x: -1.0
      y: 1.75

  - name: route_west_to_a1_upper
    description: >
      West-side route-choice benchmark from the visible west service lane to the
      upper A1 aisle. The short route crosses camera-poor west/upper space; the
      southern detour stays in better observed lanes.
    tier: paper
    claim: visibility_route_choice
    focus: west_side_route_choice
    start:
      x: -5.25
      y: -0.75
      z: 0.05
      yaw: 0.0
    goal:
      x: -3.0
      y: 3.5

  - name: control_west_to_a1_low
    description: >
      Visible-control benchmark from the west service lane to the lower A1 aisle.
      Both conditions should prefer the same visible lower route and reach the goal.
    tier: paper
    claim: no_spurious_detour
    focus: visible_control
    start:
      x: -5.25
      y: -0.75
      z: 0.05
      yaw: 0.0
    goal:
      x: -3.0
      y: -0.75

  - name: sanity_visible_apron_crossing
    description: >
      Simple visible-lane sanity check across the lower apron. Use this to
      verify simulator, detector, and state-estimation wiring before running a
      route-choice campaign.
    tier: sanity
    claim: null
    focus: visible_sanity
    start:
      x: -4.25
      y: -3.15
      z: 0.05
      yaw: 0.0
    goal:
      x: 3.45
      y: -3.15

  - name: occlusion_transit_a4
    description: >
      Diagnostic occlusion-transit: drive straight up the A4 rack aisle, whose
      interior is genuinely occluded by the tall R4 stack (GP rho~0 -> camera
      cannot detect the robot there). Visible lower apron -> BLIND A4 interior ->
      upper cross-aisle. Used to demonstrate belief dead-reckoning drift while
      blind and re-acquisition when the camera regains the robot.
    tier: diagnostic
    claim: blind_dead_reckoning
    focus: genuine_occlusion_transit
    start:
      x: 3.3
      y: -2.4
      z: 0.05
      yaw: 1.5708
    goal:
      x: 3.1
      y: 4.6

  warehouse_full_4cam.world.sdf:
  - name: full_traverse_handover
    description: >
      Flagship four-camera traverse: from the south dock apron through the
      4.5 m central aisle past the 5.2 m support pillar to the north dock apron.
      The route crosses regions where wall-mounted north/south cameras hand
      over through rack occlusion and central overlap.
    tier: exploratory
    claim: multicamera_handover_traverse
    focus: four_camera_wall_handover
    start:
      x: -1.00
      y: -7.80
      z: 0.05
      yaw: 1.5708
    goal:
      x: 1.00
      y: 7.80
  - name: route_tall_shadow_west
    description: >
      Route-choice task in the asymmetric tall block: goal deep in
      west_aisle_2_north behind the 2.61 m W2/W3 north segments. The four
      inward-looking wall cameras create partial overlap but still disagree
      around tall shelf occlusions.
    tier: exploratory
    claim: multicamera_fusion_value
    focus: four_camera_asymmetric_tall_shadows
    start:
      x: -7.78
      y: -7.80
      z: 0.05
      yaw: 1.5708
    goal:
      x: -5.68
      y: 5.50
