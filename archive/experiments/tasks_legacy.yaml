      claim: local_commitment
      focus: visible_commit_threshold
    - name: T1_shadow_cross
      maps_to: E5_shadow_tradeoff
      claim: shadow_tradeoff
      focus: visibility_tradeoff
    - name: T2_front_visibility_arc
      maps_to: E4_front_arc_full
