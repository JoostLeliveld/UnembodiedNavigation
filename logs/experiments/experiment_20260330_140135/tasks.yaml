tasks:
  warehouse_occ_light.world.sdf:
    - name: T0_front_approach
      description: Short visible sanity-check run that stops before the rack decision point, useful for verifying basic progress without requiring a large detour.
      focus: visible_sanity
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -3.3, y: 1.9}
    - name: T1_shadow_cross
      description: Primary investigation run. Starts in a clearly visible north-west pose, crosses the rack shadow, and finishes at the south-east goal.
      focus: visibility_tradeoff
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: -0.8, y: -3.0}
    - name: T2_front_visibility_arc
      description: Visible reference run that stays in front of the rack and mostly outside the occlusion shadow.
      focus: visible_reference
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.6, y: 1.2}
    - name: T3_shadow_reacquire
      description: Crosses the shadow behind the rack and then re-emerges on the east side, useful for detection-loss and reacquisition analysis.
      focus: detection_reacquisition
      start: {x: -5.0, y: 2.4, z: 0.05, yaw: 0.0}
      goal: {x: 0.4, y: -0.6}
    - name: T4_clearance_probe
      description: South-side pass that comes close to the rack footprint, useful for MPC no-go-zone tuning and obstacle-clearance comparisons.
      focus: obstacle_clearance
      start: {x: -5.0, y: -3.8, z: 0.05, yaw: 0.0}
      goal: {x: -1.1, y: -0.8}
