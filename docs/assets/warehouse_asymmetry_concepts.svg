<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-label="Three asymmetric warehouse layout concept sketches">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #17212b; }
      .sheet-title { font-size: 28px; font-weight: 750; }
      .sheet-subtitle { font-size: 14px; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #c8d2dc; stroke-width: 1.5; }
      .panel-title { font-size: 19px; font-weight: 750; }
      .panel-subtitle { font-size: 12px; fill: #52606d; }
      .floor { fill: #e8e4dc; stroke: #4d5965; stroke-width: 2; }
      .site { fill: none; stroke: #2768d8; stroke-width: 4; }
      .drive { fill: none; stroke: #80d8e7; stroke-width: 24; stroke-linejoin: round; stroke-linecap: square; opacity: 0.82; }
      .drive-wide { fill: none; stroke: #80d8e7; stroke-width: 34; stroke-linejoin: round; stroke-linecap: square; opacity: 0.82; }
      .obstacle-region { fill: #c9f4d5; fill-opacity: 0.60; stroke: #168a45; stroke-width: 2; stroke-dasharray: 5 3; }
      .rack-d { fill: #e5b949; stroke: #705820; stroke-width: 1.5; }
      .rack-e { fill: #df7555; stroke: #763623; stroke-width: 1.5; }
      .rack-f { fill: #3e8e9d; stroke: #1d5660; stroke-width: 1.5; }
      .workcell { fill: #7d6eb1; stroke: #453974; stroke-width: 1.5; }
      .stack-low { fill: #8cc9ba; stroke: #286a5e; stroke-width: 1.5; }
      .stack-high { fill: #8a4f85; stroke: #4b2347; stroke-width: 1.5; }
      .asset-label { font-size: 9px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .dark-label { font-size: 9px; font-weight: 700; fill: #2a3138; text-anchor: middle; dominant-baseline: middle; }
      .zone-label { font-size: 10px; font-weight: 650; fill: #18643a; }
      .cam { fill: #f8fafc; stroke: #151b22; stroke-width: 2; }
      .cam-label { font-size: 11px; font-weight: 800; }
      .axis { stroke: #151b22; stroke-width: 2.5; marker-end: url(#arrow); }
      .legend { font-size: 12px; fill: #344250; }
      .note { font-size: 12px; fill: #52606d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#151b22"/>
    </marker>
    <pattern id="low-stack-lines" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#8cc9ba"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e7fff8" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1500" height="760" fill="#f3f6f8"/>
  <text x="42" y="43" class="sheet-title">Asymmetric warehouse concepts — same 24 × 20 m shell</text>
  <text x="42" y="68" class="sheet-subtitle">Concept plans only. Cyan is planner-drivable floor; green is the declared obstacle region. No colour or geometry encodes camera visibility.</text>

  <!-- Concept 1 -->
  <g transform="translate(20 86)">
    <rect class="panel" x="0" y="0" width="470" height="558" rx="12"/>
    <text x="22" y="34" class="panel-title">1 · Offset spine</text>
    <text x="22" y="55" class="panel-subtitle">4 cameras · lowest-risk change · current AABB map</text>
    <g transform="translate(35 82)">
      <rect class="floor" x="0" y="0" width="400" height="334"/>
      <rect class="site" x="10" y="12" width="380" height="310"/>

      <!-- Drivable union: orthogonal dog-leg and cross aisles, never a visibility field. -->
      <path class="drive-wide" d="M28 305 H365 M35 30 H362 M32 166 H205 V118 H365 M69 36 V302 M123 36 V302 M186 116 V301 M240 36 V287 M303 36 V164 M365 36 V300"/>

      <!-- West staggered rack bank. -->
      <rect class="obstacle-region" x="82" y="51" width="26" height="120" rx="2"/>
      <rect class="rack-d" x="88" y="57" width="14" height="108"/>
      <text class="dark-label" x="95" y="111">D</text>
      <rect class="obstacle-region" x="136" y="90" width="26" height="154" rx="2"/>
      <rect class="rack-e" x="142" y="96" width="14" height="142"/>
      <text class="asset-label" x="149" y="167">E</text>
      <rect class="obstacle-region" x="199" y="29" width="26" height="126" rx="2"/>
      <rect class="rack-f" x="205" y="35" width="14" height="114"/>
      <text class="asset-label" x="212" y="92">F</text>

      <!-- East mixed-depth bank and QC cell. -->
      <rect class="obstacle-region" x="253" y="54" width="26" height="170" rx="2"/>
      <rect class="rack-e" x="259" y="60" width="14" height="158"/>
      <text class="asset-label" x="266" y="139">E</text>
      <rect class="obstacle-region" x="316" y="151" width="27" height="119" rx="2"/>
      <rect class="rack-d" x="322" y="157" width="15" height="107"/>
      <text class="dark-label" x="329.5" y="210">D</text>
      <rect class="obstacle-region" x="303" y="39" width="74" height="41" rx="2"/>
      <rect class="workcell" x="311" y="47" width="58" height="25" rx="2"/>
      <text class="asset-label" x="340" y="59">DeskC / QC</text>

      <!-- Angled pallet/box staging stays inside a conservative rectangular obstacle pad. -->
      <rect class="obstacle-region" x="269" y="278" width="87" height="38" rx="2"/>
      <g transform="rotate(-11 312 297)">
        <rect class="stack-high" x="279" y="286" width="29" height="22"/>
        <rect fill="url(#low-stack-lines)" stroke="#286a5e" stroke-width="1.5" x="314" y="286" width="31" height="22"/>
      </g>
      <text class="asset-label" x="294" y="297">H</text>
      <text class="dark-label" x="329" y="297">L</text>

      <!-- Unequal box stacks are always nested inside green obstacle regions. -->
      <rect class="obstacle-region" x="30" y="211" width="27" height="47" rx="2"/>
      <rect class="stack-low" x="36" y="219" width="15" height="31"/>
      <text class="dark-label" x="43.5" y="235">L</text>
      <rect class="obstacle-region" x="211" y="248" width="28" height="43" rx="2"/>
      <rect class="stack-high" x="217" y="255" width="16" height="29"/>
      <text class="asset-label" x="225" y="270">H</text>

      <!-- Camera arrows indicate optical axis only. -->
      <circle class="cam" cx="75" cy="329" r="10"/><text class="cam-label" x="68" y="327">A</text><line class="axis" x1="82" y1="322" x2="108" y2="294"/>
      <circle class="cam" cx="3" cy="192" r="10"/><text class="cam-label" x="-4" y="190">B</text><line class="axis" x1="12" y1="191" x2="47" y2="181"/>
      <circle class="cam" cx="292" cy="5" r="10"/><text class="cam-label" x="285" y="3">C</text><line class="axis" x1="286" y1="13" x2="266" y2="43"/>
      <circle class="cam" cx="397" cy="246" r="10"/><text class="cam-label" x="390" y="244">D</text><line class="axis" x1="388" y1="243" x2="354" y2="231"/>
    </g>
    <text x="22" y="449" class="note">Unequal rack lengths force a central dog-leg; low stacks protect</text>
    <text x="22" y="467" class="note">crossings while high stacks sit deeper in storage zones.</text>
    <text x="22" y="492" class="note">Mesh mix: ShelfD/E/F, DeskC, PalletJackB, ClutteringA/C.</text>
    <text x="22" y="516" class="note">Camera mounts: south + west + north + east; varied yaw/height.</text>
  </g>

  <!-- Concept 2 -->
  <g transform="translate(515 86)">
    <rect class="panel" x="0" y="0" width="470" height="558" rx="12"/>
    <text x="22" y="34" class="panel-title">2 · L-flow mixed zones</text>
    <text x="22" y="55" class="panel-subtitle">RECOMMENDED · 4 cameras · current AABB map</text>
    <g transform="translate(35 82)">
      <rect class="floor" x="0" y="0" width="400" height="334"/>
      <rect class="site" x="10" y="12" width="380" height="310"/>
      <path class="drive-wide" d="M28 300 H370 M30 37 H365 M30 175 H370 M78 38 V297 M188 39 V174 M236 176 V300 M347 39 V299"/>
      <path class="drive" d="M78 245 H236 V118 H347"/>

      <!-- North horizontal rack zone. -->
      <rect class="obstacle-region" x="101" y="58" width="94" height="28" rx="2"/>
      <rect class="rack-f" x="108" y="64" width="80" height="16"/>
      <text class="asset-label" x="148" y="72">ShelfF</text>
      <rect class="obstacle-region" x="225" y="96" width="116" height="28" rx="2"/>
      <rect class="rack-d" x="232" y="102" width="102" height="16"/>
      <text class="dark-label" x="283" y="110">ShelfD</text>

      <!-- South vertical rack zone. -->
      <rect class="obstacle-region" x="95" y="198" width="28" height="91" rx="2"/>
      <rect class="rack-e" x="101" y="204" width="16" height="79"/>
      <text class="asset-label" x="109" y="243">E</text>
      <rect class="obstacle-region" x="149" y="217" width="28" height="72" rx="2"/>
      <rect class="rack-d" x="155" y="223" width="16" height="60"/>
      <text class="dark-label" x="163" y="253">D</text>
      <rect class="obstacle-region" x="260" y="201" width="28" height="89" rx="2"/>
      <rect class="rack-f" x="266" y="207" width="16" height="77"/>
      <text class="asset-label" x="274" y="246">F</text>

      <!-- Realistic dispatch and packing zones. -->
      <rect class="obstacle-region" x="299" y="211" width="48" height="52" rx="2"/>
      <rect class="workcell" x="306" y="218" width="34" height="17"/><text class="asset-label" x="323" y="227">QC</text>
      <rect class="stack-low" x="306" y="240" width="14" height="15"/><text class="dark-label" x="313" y="248">L</text>
      <rect class="stack-high" x="325" y="240" width="14" height="15"/><text class="asset-label" x="332" y="248">H</text>
      <rect class="obstacle-region" x="27" y="83" width="34" height="48" rx="2"/>
      <rect class="stack-high" x="34" y="91" width="20" height="32"/><text class="asset-label" x="44" y="107">H</text>

      <!-- Existing structural column remains inside its own obstacle pad. -->
      <rect class="obstacle-region" x="198" y="174" width="24" height="25" rx="2"/>
      <rect class="workcell" x="205" y="181" width="10" height="11"/>

      <circle class="cam" cx="145" cy="329" r="10"/><text class="cam-label" x="138" y="327">A</text><line class="axis" x1="149" y1="319" x2="160" y2="285"/>
      <circle class="cam" cx="76" cy="5" r="10"/><text class="cam-label" x="69" y="3">B</text><line class="axis" x1="83" y1="13" x2="106" y2="40"/>
      <circle class="cam" cx="397" cy="105" r="10"/><text class="cam-label" x="390" y="103">C</text><line class="axis" x1="387" y1="108" x2="351" y2="120"/>
      <circle class="cam" cx="3" cy="269" r="10"/><text class="cam-label" x="-4" y="267">D</text><line class="axis" x1="12" y1="265" x2="46" y2="251"/>
    </g>
    <text x="22" y="449" class="note">Bulk and fast-pick racks run at 90° to each other, creating</text>
    <text x="22" y="467" class="note">awkward but plausible transfer corners and unequal route choices.</text>
    <text x="22" y="492" class="note">Mesh mix: ShelfF/D/E, DeskC, PalletJackB, TrashCanC.</text>
    <text x="22" y="516" class="note">Four asymmetric wall mounts retain the existing A–D pipeline.</text>
  </g>

  <!-- Concept 3 -->
  <g transform="translate(1010 86)">
    <rect class="panel" x="0" y="0" width="470" height="558" rx="12"/>
    <text x="22" y="34" class="panel-title">3 · Retrofit fan + quarantine bay</text>
    <text x="22" y="55" class="panel-subtitle">4 cameras · rotated objects inside conservative AABB pad</text>
    <g transform="translate(35 82)">
      <rect class="floor" x="0" y="0" width="400" height="334"/>
      <rect class="site" x="10" y="12" width="380" height="310"/>
      <path class="drive-wide" d="M42 297 V42 H356 V297 M42 172 H160 V120 H356 M102 297 V220 H270 V298"/>
      <path class="drive" d="M160 42 V120 M270 120 V298"/>

      <!-- Perimeter and asymmetric island storage. -->
      <rect class="obstacle-region" x="68" y="63" width="72" height="28" rx="2"/>
      <rect class="rack-d" x="75" y="69" width="58" height="16"/><text class="dark-label" x="104" y="77">ShelfD</text>
      <rect class="obstacle-region" x="183" y="63" width="139" height="28" rx="2"/>
      <rect class="rack-f" x="190" y="69" width="125" height="16"/><text class="asset-label" x="252" y="77">ShelfF</text>
      <rect class="obstacle-region" x="68" y="197" width="28" height="82" rx="2"/>
      <rect class="rack-e" x="74" y="203" width="16" height="70"/><text class="asset-label" x="82" y="238">E</text>
      <rect class="obstacle-region" x="294" y="149" width="28" height="130" rx="2"/>
      <rect class="rack-d" x="300" y="155" width="16" height="118"/><text class="dark-label" x="308" y="214">D</text>

      <!-- Rotated quarantine/pallet bay: the no-go pad is axis-aligned and conservative. -->
      <rect class="obstacle-region" x="136" y="137" width="126" height="68" rx="2"/>
      <g transform="rotate(12 199 171)">
        <rect class="rack-e" x="149" y="151" width="82" height="17"/>
        <rect class="stack-high" x="149" y="174" width="31" height="18"/>
        <rect fill="url(#low-stack-lines)" stroke="#286a5e" stroke-width="1.5" x="187" y="174" width="34" height="18"/>
      </g>
      <text class="asset-label" x="164" y="183">H</text>
      <text class="dark-label" x="205" y="187">L</text>

      <!-- Dispatch / returns clutter bay. -->
      <rect class="obstacle-region" x="115" y="258" width="79" height="40" rx="2"/>
      <rect class="workcell" x="122" y="265" width="27" height="26"/><text class="asset-label" x="135.5" y="278">Desk</text>
      <rect class="stack-low" x="155" y="265" width="31" height="12"/><text class="dark-label" x="170.5" y="271">L</text>
      <rect class="stack-high" x="155" y="280" width="31" height="11"/><text class="asset-label" x="170.5" y="286">H</text>

      <circle class="cam" cx="26" cy="317" r="10"/><text class="cam-label" x="19" y="315">A</text><line class="axis" x1="34" y1="309" x2="61" y2="283"/>
      <circle class="cam" cx="3" cy="90" r="10"/><text class="cam-label" x="-4" y="88">B</text><line class="axis" x1="12" y1="94" x2="43" y2="108"/>
      <circle class="cam" cx="279" cy="5" r="10"/><text class="cam-label" x="272" y="3">C</text><line class="axis" x1="274" y1="14" x2="256" y2="46"/>
      <circle class="cam" cx="397" cy="233" r="10"/><text class="cam-label" x="390" y="231">D</text><line class="axis" x1="387" y1="232" x2="350" y2="226"/>
    </g>
    <text x="22" y="449" class="note">A clear U-shaped circulation loop surrounds an angled quarantine bay.</text>
    <text x="22" y="467" class="note">The planner sees only the rectangular no-go pad, not its contents.</text>
    <text x="22" y="492" class="note">Mesh mix: ShelfD/E/F, ClutteringC/D, Bucket, DeskC.</text>
    <text x="22" y="516" class="note">Tighter diagonal routing would require polygon-map support later.</text>
  </g>

  <!-- Global legend and contract note. -->
  <g transform="translate(38 670)">
    <line x1="0" y1="14" x2="42" y2="14" class="drive"/><text class="legend" x="54" y="18">planner-drivable union only</text>
    <rect class="obstacle-region" x="240" y="1" width="36" height="26"/><text class="legend" x="286" y="18">declared obstacle region</text>
    <rect class="rack-d" x="485" y="2" width="28" height="24"/><rect class="rack-e" x="518" y="2" width="28" height="24"/><rect class="rack-f" x="551" y="2" width="28" height="24"/><text class="legend" x="590" y="18">ShelfD / ShelfE / ShelfF visual families</text>
    <rect class="stack-low" x="858" y="2" width="28" height="24"/><text class="dark-label" x="872" y="14">L</text>
    <rect class="stack-high" x="891" y="2" width="28" height="24"/><text class="asset-label" x="905" y="14">H</text><text class="legend" x="930" y="18">low / high box stacks</text>
    <circle class="cam" cx="1112" cy="14" r="10"/><line class="axis" x1="1123" y1="14" x2="1156" y2="14"/><text class="legend" x="1168" y="18">camera + optical axis (not FOV)</text>
    <text class="note" x="0" y="54">Contract for all options: every collision object is contained by a green no-go region; cyan contains no visibility probability, camera preference, or FOV information.</text>
  </g>
</svg>
