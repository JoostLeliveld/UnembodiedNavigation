# Machine-checkable contract for the active honest-campaign runtime.
# The executable source of truth remains:
# scripts/visibility_comparison/warehouse_visibility_campaign.yaml

current_runtime_contract:
  version: 1.0
  updated: 2026-07-03
  status: active_current_surface
  source_config: scripts/visibility_comparison/warehouse_visibility_campaign.yaml
  historical_paper_snapshot: docs/paper_runtime_contract.yaml

  purpose: >
    Define the active runtime/story surface used by the current honest campaign
    and the top-level midterm presentation. The submitted paper remains a
    historical deliverable; this file prevents current runs from being mixed with
    the paper-era config and metrics.

  active_conditions:
    C1:
      planner: constant_R_efe
      uses_gp_visibility: false
    C2:
      planner: visibility_aware_efe
      uses_gp_visibility: true

  retired_active_conditions:
    - risk_only_ablation

  locked_runtime:
    world: warehouse_aws.world.sdf
    launch_file: warehouse_primary_comparison.launch.py
    tasks:
      - route_apron_to_a3_mid
      - route_apron_to_a2_mid
      - route_west_to_a1_upper
      - control_west_to_a1_low
    seeds: [0, 1, 2, 3, 4]
    yolo_model: logs/perception_models/warehouse_yolo_detector_v1/model.pt
    yolo_trained_imgsz: 960
    yolo_inference_imgsz: 640
    yolo_conf_threshold: 0.05
    yolo_iou_threshold: 0.45
    yolo_use_masks: false
    selected_pixel_source: bbox_bottom
    gp_artifact: paper_artifacts/gp/warehouse_visibility_gp_v1/yolo_score_raw_gp.npz
    heading_update_mode: camera_xy_only
    no_keypoint_or_visual_heading: true
    global_horizon: 75
    global_dt: 0.4
    lookahead_s: 30.0
    pixel_correction_nis_threshold: 9.21
    use_belief_nogo_cost: true
    nogo_mode: keep_in
    nogo_penalty_type: warning_band
    nogo_weight: 2000.0
    nogo_belief_kappa: 1.0
    use_ground_truth_metrics: true
    allow_odom_metric_fallback: false

  current_result_surface:
    source: docs/paper_vs_current/current/
    campaign_log: logs/visibility_comparison/honest_campaign_v1
    C1_clean_goals: 15/20
    C2_clean_goals: 20/20
    C1_gt_geometry_breaches: 4/20
    C2_gt_geometry_breaches: 0/20
    physics_contacts: 0

  forbidden_active_behaviors:
    - silently_falling_back_to_profile_gp_artifact
    - silently_substituting_odom_for_ground_truth_metrics
    - using_pose_keypoint_or_visual_heading_in_current_campaign
    - exposing_disabled_odom_heading_correction_switches_in_current_campaign
    - treating_the_submitted_paper_snapshot_as_current_runtime
