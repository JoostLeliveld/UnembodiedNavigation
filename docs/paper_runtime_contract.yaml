# Historical, machine-readable snapshot of the submitted-paper runtime.
# This is not the active runtime contract. Current runs use:
# docs/current_runtime_contract.yaml

paper_runtime_contract:
  version: 1.0
  updated: 2026-07-03
  status: submitted_paper_snapshot
  active_current_contract: docs/current_runtime_contract.yaml

  purpose: >
    Preserve the runtime assumptions and reported outcomes behind the submitted
    paper without pretending they are still the executable current campaign. Use
    this file for paper comparison/provenance only.

  paper_campaign_status_2026_06_12: >
    Submitted robustness snapshot: C1 reaches 12/20 with 8/20 reported
    collisions; C2 reaches 16/20 with 2/20 reported collisions, 1/20
    near-success, and 1/20 infrastructure-invalid run. Later audit work found
    that those collision metrics were odom-derived and that the paper contact
    sensor path was structurally silent. The current honest campaign is recorded
    separately in docs/current_runtime_contract.yaml.

  reported_worlds:
    - warehouse_aws.world.sdf

  reported_tasks:
    - F31_b1_apron_a3_mid
    - b5_a4_apron_to_a2_mid
    - b2_a0_west_to_a1_upper
    - b6_a0_west_to_a1_low_control

  locked_artifacts:
    world: warehouse_aws.world.sdf
    camera_pose: {x: 0.0, y: -5.5, z: 4.8}
    detector: local_artifacts/perception_models/aws_yolo_simseg_v2/model.pt
    gp_artifact: paper_artifacts/gp/archive/aws_gp_v7b_superseded/yolo_score_raw_gp.npz
    gp_params: {kernel: rbf, length_scale: 0.90, beta: 0.5, noise_var: 0.05}
    selected_pixel_source: bbox_bottom

  allowed_planner_conditions:
    C1:
      planner: constant_R_efe
      paper_name: constant-observability EFE
      uses_gp_visibility: false
      use_observation_risk: true
      use_ambiguity: true
    C2:
      planner: visibility_aware_efe
      paper_name: learned-observability EFE
      uses_gp_visibility: true
      use_observation_risk: true
      use_ambiguity: true

  locked_runtime:
    hierarchical: true
    global_solve_role: route_level_EFE_choice
    global_horizon: 120
    global_dt: 0.25
    lookahead_s: 30.0
    v_max: 0.60
    local_solve_role: short_horizon_tracking_of_planner_waypoints
    use_simple_local_controller: true
    heading_update_mode: camera_xy_only
    use_odom_heading_correction: false
    no_keypoint_or_visual_heading: true
    nogo_mode: keep_in
    nogo_penalty_type: warning_band
    nogo_weight: 2000.0
    nogo_warning_band: 0.05
    use_belief_nogo_cost: true
    nogo_belief_kappa: 1.0
    perception:
      yolo_imgsz: 640
      conf_threshold: 0.10
      iou_threshold: 0.45
      class_filter: robot
      use_masks: false
      selected_pixel_source: bbox_bottom
    pixel_correction_nis_threshold: 0.0
    nis_gate_disabled_in_paper_runs: true

  known_historical_caveats:
    - paper_runner_did_not_forward_keep_in_as_intended
    - metrics_used_odom_as_truth_for_collision_and_clearance_claims
    - physics_contact_bridge_had_no_real_contact_sensor_events
    - detector_training_data_was_later_found_contaminated
    - paper_gp_used_raw_yolo_confidence_instead_of_detection_rate

  compare_against_current:
    config_diff: docs/paper_vs_current/README.md
    paper_snapshot: docs/paper_vs_current/paper/
    current_snapshot: docs/paper_vs_current/current/
