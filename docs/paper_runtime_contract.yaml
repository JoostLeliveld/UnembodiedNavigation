# Machine-readable contract for paper-facing runs — the SINGLE runtime contract.
# (Consolidates the former runtime_method_contract.md + F86_method_and_runtime_contract.md.)
# Keep aligned with docs/paper_alignment.md, docs/experiment_registry.md, and the
# active config scripts/visibility_comparison/aws_f31b1_final_config.yaml.

paper_runtime_contract:
  version: 0.5
  updated: 2026-06-10
  purpose: >
    Define the behavior that counts as paper-facing execution for the
    external-camera visibility-aware EFE experiments.
  changelog_0_5: >
    Reconcile to the locked 2026-06-10 runtime. Camera raised+back (z=4.8, y=-5.5);
    GP = aws_gp_v7 (length_scale 0.90, beta 0.5, noise_var 0.05). Heading =
    camera_xy_only (no odom-yaw anchor, no keypoint/visual heading). No-go =
    hinged-log warning_band (keep_in), weight 2000, band 0.05 (replaces log_barrier
    and the belief-nogo route mechanism). Global EFE horizon 120 + shared simple
    proportional local tracker. Main task = F31_b1_apron_a3_mid (a0 = saved secondary).
    Absorbed the C1/C2 + multistart + driveability rules from the two retired .md contracts.

  evidence_status: candidate_until_complete_artifact_chain

  open_status_2026_06_10: >
    HONEST OPEN ITEM: with control_weight=0 and goal_progress_cost=0 the objective has
    no path-length/effort term, so on F31_b1 both C1 and C2 currently prefer the
    lower-sweep — the intended C1-short-blind vs C2-long-observable route-split does NOT
    yet emerge under this runtime. The connector seam artifact was fixed (driveable
    prisms overlap). No surviving doc may claim a closed-loop F31_b1 route-split until
    it is actually produced and logged. (F88 offline diagnosis in progress.)

  reported_worlds:
    - warehouse_aws.world.sdf

  reported_tasks:
    - F31_b1_apron_a3_mid        # MAIN route-choice (occluded mid vs visible lower-sweep)
  saved_secondary_tasks:
    - a0_west_to_a1_upper_blocked_mid   # saved a0 line for a future multi-task run

  locked_artifacts:
    world: warehouse_aws.world.sdf
    camera_pose: {x: 0.0, y: -5.5, z: 4.8}     # raised+back, locked 2026-06-10
    gp_artifact: logs/visibility_comparison/aws_gp_v7/yolo_score_raw_gp.npz
    gp_params: {kernel: rbf, length_scale: 0.90, beta: 0.5, noise_var: 0.05}
    detector: logs/perception_models/aws_yolo_simseg_v2/model.pt
    superseded: {gps: [aws_gp_v5, aws_gp_v6, aws_gp_v6b], cameras: ["z=4.5/y=-4.9", "z=4.9/y=-5.5"]}

  allowed_planner_conditions:
    constant_R_efe:        # C1
      paper_name: constant-observability EFE
      description: EFE planner with spatially uniform detector-observation covariance. Risk and ambiguity both active.
      uses_gp_visibility: false
      use_observation_risk: true
      use_ambiguity: true
    visibility_aware_efe:  # C2
      paper_name: learned-observability EFE
      description: EFE planner with learned state-dependent detector-observation covariance (GP affects camera (x,y) covariance only; not heading). Risk and ambiguity both active.
      uses_gp_visibility: true
      use_observation_risk: true
      use_ambiguity: true
    risk_only_ablation:    # C3 (optional)
      paper_name: GP-risk-only ablation
      description: GP covariance active, ambiguity disabled.
      uses_gp_visibility: true
      use_observation_risk: true
      use_ambiguity: false

  c1_c2_difference_allowed:
    - planner_facing_camera_observation_covariance
    - gp_query_enabled_only_for_c2
  c1_c2_difference_forbidden:
    - different_task
    - different_driveable_barrier
    - different_candidate_set
    - different_horizon_or_optimizer_budget
    - mission_waypoints

  multistart:
    allowed: true
    interpretation: condition-neutral_optimizer_basin_handling
    candidate_generation_may_use: [known_2d_driveable_floor, known_2d_lane_graph_route_seeds, local_escape_maneuvers, shifted_previous_solution]
    candidate_generation_must_not_use: [gp_visibility_map, condition_label, hand_authored_visibility_route, mission_waypoints]

  driveable_region_handling:
    layer_name: known_driveable_forbidden_zone_layer
    nogo_mode: keep_in
    penalty_type: warning_band     # hinged-log; zero for valid interior (clearance >= band)
    same_across_conditions: true
    leaving_driveable_floor_must_not_be_cost_optimal: true
    note: >
      driveable_geometry_json = union of axis-aligned prisms (aisles + R2-R5 mid-gap
      connectors); driveable = inside any prism. Connectors overlap adjacent aisles so
      the union signed-distance has no false-violation seam at edge boundaries.

  locked_runtime:   # mirrors scripts/visibility_comparison/aws_f31b1_final_config.yaml (2026-06-10)
    hierarchical: true
    global_solve_role: route_level_EFE_choice
    global_horizon: 120
    global_dt: 0.25
    v_max: 0.60
    local_solve_role: short_horizon_tracking_of_planner_waypoints
    use_simple_local_controller: true
    simple_tracker_role: execution_plumbing_not_route_choice
    simple_tracker_note: >
      Shared across C1/C2/C3; does not query the GP or optimize EFE locally. Tracks
      planner waypoints, protected by a local keep-in clearance gate. Scientific route
      choice is the GLOBAL EFE solve only.
    heading_update_mode: camera_xy_only   # odom dead-reckoning predict; pixel (x,y) update couples to heading via cross-cov only
    use_odom_heading_correction: false
    no_keypoint_or_visual_heading: true
    nogo_weight: 2000.0
    nogo_safe_distance: 0.15
    nogo_warning_band: 0.05
    nogo_near_weight: 50.0
    use_belief_nogo_cost: false           # global; belief-nogo route mechanism retired
    ambiguity_weight: 18.0
    risk_weight_obs: 1.0
    control_weight: 0.0                    # NOTE: no path-length/effort term (see open_status_2026_06_10)
    goal_prior_u_std: {start: 50.0, final: 12.0}
    goal_prior_v_std: {start: 50.0, final: 12.0}
    optimizer_multistart: true
    optimizer_multistart_include_direct: false
    optimizer_multistart_lateral_offsets: 0.0   # removed: +/-1m shift hit a non-driveable corner
    optimizer_initial_routes: [mid_cross_lane, lower_sweep_lane]
    perception: {yolo_imgsz: 640, conf_threshold: 0.10, use_masks: true, selected_pixel_source: mask_bottom}
    use_command_noise: true
    use_encoder_noise: true

  required_runtime_settings:
    perception_backend: yolo
    direct_visibility_reward_allowed: false
    known_obstacle_map_required: true
    known_driveable_region_required: true
    no_go_barrier_must_match_across_conditions: true
    command_noise_required_for_aws_diagnostics: true
    crash_or_contact_ends_run_and_is_tracked: true
    yolo_model_must_be_explicit: true
    visibility_artifact_path_must_be_explicit_for_gp_conditions: true
    process_hygiene_required: true   # reap encoder_noise_node + actuation_noise_node between runs
    single_odom_noisy_publisher_required: true  # >1 => pi-offset heading corruption

  hard_fail_on_missing:
    - yolo_model
    - visibility_artifact_path_for_visibility_conditions
    - camera_model
    - camera_projection_model
    - world_bounds
    - obstacle_geometry
    - obstacle_barrier_parameters
    - truth_pose_source
    - run_manifest
    - experiment_csv
    - run_summary
    - collision_fields_for_success_claims

  plotting_rules:
    require_real_run_dir: true
    require_real_trace_csv: true
    allow_schematic_fallback_by_default: false
    require_panel_a_screenshot_for_problem_figure: true

  metric_rules:
    separate_completed_protocol_from_success: true
    timeout_after_first_cmd_is_success_by_itself: false
    collision_or_penetration_invalidates_success: true
    near_goal_stuck_requires_explicit_label: true
    runtime_means_start_at_first_nontrivial_command: true
    pre_command_rows_excluded_from_runtime_plots_and_means: true
    pre_command_phase_may_be_reported_separately: [launch_wait, global_solve_time, estimator_warmup]
    runtime_metrics_require_after_first_command_filter:
      - localization_error
      - planner_belief_error
      - yaw_error
      - waypoint_tracking_error
      - detection_rate
      - rejected_correction_rate
      - obstacle_clearance
      - command_age
      - local_solve_time
    planner_relevant_localization_metric: truth_belief_error_m

  artifact_rules:
    gp_artifact_must_record: [schema_version, source_samples, source_targets, world, camera_setup, kernel, length_scale, noise_variance, beta, grid_shape]
    yolo_model_must_record: [dataset_path, train_val_split, model_path, inference_threshold]

  forbidden_silent_behaviors:
    - silently_using_non_yolo_perception_in_paper_launch
    - silently_falling_back_to_profile_gp_artifact
    - silently_plotting_schematic_trajectory_when_run_trace_missing
    - silently_counting_timeout_as_goal_success
    - silently_clipping_gp_queries_without_diagnostic
    - mission_waypoints_for_route_choice
    - constant_R_efe_without_ambiguity
    - visibility_dependent_multistart_candidates
    - claiming_a_route_split_not_present_in_logs
