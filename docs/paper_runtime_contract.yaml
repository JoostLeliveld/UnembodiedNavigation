# Machine-readable checklist for paper-facing runs.
# Keep this aligned with docs/paper_alignment.md and thesis-report/sections/*.tex.

paper_runtime_contract:
  version: 0.4
  purpose: >
    Define the behavior that counts as paper-facing execution for the
    external-camera visibility-aware EFE experiments.
  changelog_0_4: >
    Define the AWS paper-facing candidate method. Warehouse_aws may become the
    reported benchmark only after the final artifact chain is complete. Lock the
    candidate method: hierarchical global EFE (H80/dt0.25) + simple proportional
    local tracker (yaw_gate rotate-then-go), GP-conditioned belief-nogo, imgsz480
    perception with forward-prediction. Add process-hygiene requirement (reap
    encoder/actuation noise nodes between runs). Claim axis = localization
    safety/stability, not deterministic goal-reaching.

  evidence_status: candidate_until_complete_artifact_chain

  reported_worlds:
    - warehouse_aws.world.sdf

  legacy_worlds:
    - warehouse_occ_light.world.sdf

  reported_tasks:
    - F31_b1_apron_a3_mid        # main route-choice (occluded vs visible)
    - visible_aisle_sanity_aws   # visible->visible control (C1~=C2)
    # Tier-C generality tasks added after GP-field coordinate validation.

  legacy_tasks:
    - shadow_tradeoff_a
    - shadow_tradeoff_b
    - sanity_open
    - main_shadow_tradeoff

  allowed_planner_conditions:
    constant_R_efe:
      paper_name: constant-observability EFE
      description: EFE planner with spatially uniform detector-observation covariance. Risk and ambiguity are both active.
      requires_visibility_artifact: false
      use_observation_risk: true
      use_ambiguity: true
      uses_gp_visibility: false
    visibility_aware_efe:
      paper_name: learned-observability EFE
      description: EFE planner with learned state-dependent detector-observation covariance. Risk and ambiguity are both active.
      requires_visibility_artifact: true
      use_observation_risk: true
      use_ambiguity: true
      uses_gp_visibility: true
    risk_only_ablation:
      paper_name: GP-risk-only ablation
      description: Optional ablation with GP covariance active and ambiguity disabled.
      requires_visibility_artifact: true
      use_observation_risk: true
      use_ambiguity: false
      uses_gp_visibility: true

  locked_runtime_method:
    main_route_choice_task:
      world: warehouse_aws.world.sdf
      task: F31_b1_apron_a3_mid
      start: {x: 3.30, y: -1.00, yaw: 0.0}
      goal: {x: 1.00, y: 1.75}
      status: candidate_paper_facing
    c1_c2_difference_allowed:
      - planner_facing_camera_observation_covariance
      - gp_query_enabled_only_for_c2
    c1_c2_difference_forbidden:
      - different_task
      - different_driveable_barrier
      - different_candidate_set
      - different_horizon_or_optimizer_budget
      - mission_waypoints
    multistart:
      allowed: true
      interpretation: condition-neutral_optimizer_basin_handling
      candidate_generation_may_use:
        - known_2d_driveable_floor
        - known_2d_lane_graph_route_seeds
        - local_escape_maneuvers
        - shifted_previous_solution
      candidate_generation_must_not_use:
        - gp_visibility_map
        - condition_label
        - hand_authored_visibility_route
        - mission_waypoints
    driveable_region_handling:
      layer_name: known_driveable_forbidden_zone_layer
      barrier: two_sigma_belief_tube_log_barrier
      same_across_conditions: true
      covariance_for_tube: expected_posterior_after_planner_facing_camera_update
      hard_validity_gate_required: true
      simple_local_tracker_gate: predicted_mean_clearance_gate
      safe_stop_fallback_role: execution_hygiene_only
      leaving_driveable_floor_must_not_be_cost_optimal: true
    hierarchical_runtime:
      required_for_aws_diagnostics: true
      global_solve_role: route_level_EFE_choice
      local_solve_role: short_horizon_tracking_of_planner_derived_waypoints
      mission_waypoints_allowed: false
      global_waypoints_are_condition_specific: true
    aws_locked_candidate:   # frozen 2026-06-03 (Phase 0); see aws_paper_final_config.yaml
      use_hierarchical: true
      global_horizon: 80
      global_dt: 0.25
      global_optimizer_maxiter: 80
      # Local tracker: boring proportional waypoint follower (no GP/ambiguity/EFE),
      # rotate-in-place when misaligned. Identical across C1/C2/C3.
      use_simple_local_controller: true
      simple_tracker_yaw_gate_rad: 0.6
      simple_tracker_role: execution_plumbing_not_route_choice
      simple_tracker_safety_note: >
        The simple tracker is shared across C1/C2/C3 and does not query the GP
        or optimize the EFE objective locally. It tracks planner-derived
        waypoints using odom yaw and is protected by a lightweight predicted
        mean-clearance gate; the scientific route choice remains the global EFE
        solve.
      local_tracking_use_odom_yaw: true
      waypoint_spacing_m: 0.40
      waypoint_arrival_radius_m: 0.20
      v_max: 0.60
      optimizer_multistart_include_direct: false
      optimizer_multistart_lateral_offsets: "-1.0,1.0"
      optimizer_initial_routes:        # warehouse domain-prior lanes (known aisles)
        - mid_cross_lane
        - lower_sweep_lane
      nogo_weight: 200.0
      nogo_safe_distance: 0.30
      use_belief_nogo_cost: true
      nogo_belief_kappa: 2.0
      r_visible_uv: 2.5
      r_miss_uv: 40.0
      ambiguity_weight: 8.0
      use_command_noise: true
      use_encoder_noise: true
      perception:
        yolo_imgsz: 480              # ~90ms inference (was 137ms at 640)
        selected_pixel_source: bbox_bottom
        mask_bottom_role: diagnostic_only
        visual_heading_from_yolo: false
        pixel_forward_prediction: odom_noisy_replay_preferred
        command_replay_role: fallback_only         # when odom samples are unavailable
        bev_y_calibration_offset_m: 0.05           # measured static geometric dy bias
        pixel_max_correction_jump_m: 0.50          # near-rack outlier rejection
        pixel_corr_nis_logged: true
      route_seed_constraints:
        same_for_c1_and_c2: true
        may_use_known_2d_driveable_floor: true
        must_not_use_gp_visibility: true
        must_not_encode_expected_conclusion: true
      mechanism_note: >
        Route choice is driven by GP-conditioned belief-nogo feasibility: in the
        occluded gap the high R_plan barely reduces the predicted covariance, so
        the per-step belief-nogo posterior covariance is ~4x larger for C2
        (0.165m vs C1 0.042m major-axis), raising the occluded route's clearance
        demand. The ambiguity term contributes modestly; C3 (ambiguity off, GP on)
        is the decisive ablation. Report as belief-space localization-safety, NOT
        as an information/ambiguity-cost flip. The binary route-flip can be
        optimizer-basin sensitive in the narrow aisle (disclose as a local-minima
        / solver limitation).

  required_runtime_settings:
    perception_backend: yolo
    direct_visibility_reward_allowed: false
    visibility_weight_required_value: 0.0
    known_obstacle_map_required: true
    known_driveable_region_required: true
    no_go_barrier_must_match_across_conditions: true
    two_sigma_belief_tube_barrier_required_for_aws_diagnostics: true
    command_noise_required_for_aws_diagnostics: true
    crash_or_contact_ends_run_and_is_tracked: true
    yolo_model_must_be_explicit: true
    visibility_artifact_path_must_be_explicit_for_gp_conditions: true
    process_hygiene_required: true   # reap encoder_noise_node + actuation_noise_node
    single_odom_noisy_publisher_required: true  # >1 => pi-offset heading corruption (C1 bug, fixed 2026-06-03)

  heading_modes:
    current_campaign:
      use_displacement_heading: false
      use_odom_heading_correction: true
      manifest_state_source_theta: odometry_heading
    displacement_heading_diagnostic:
      use_displacement_heading: true
      use_odom_heading_correction: false
      manifest_state_source_theta: pixel_displacement_heading

  required_paths:
    yolo_model:
      must_exist: true
      may_be_empty: false
    visibility_artifact_path:
      must_exist_for:
        - visibility_aware_efe
        - risk_only_ablation
      may_be_implicit_from_world_profile: false

  hard_fail_on_missing:
    - yolo_model
    - visibility_artifact_path_for_visibility_conditions
    - camera_model
    - camera_projection_model
    - world_bounds
    - obstacle_geometry
    - obstacle_barrier_parameters
    - truth_pose_source
    - run_manifest
    - experiment_csv
    - run_summary
    - collision_fields_for_success_claims

  plotting_rules:
    require_real_run_dir: true
    require_real_trace_csv: true
    allow_schematic_fallback_by_default: false
    require_panel_a_screenshot_for_problem_figure: true
    allow_placeholder_panel_a_by_default: false

  metric_rules:
    separate_completed_protocol_from_success: true
    timeout_after_first_cmd_is_success_by_itself: false
    collision_or_penetration_invalidates_success: true
    near_goal_stuck_requires_explicit_label: true
    runtime_means_start_at_first_nontrivial_command: true
    pre_command_rows_excluded_from_runtime_plots_and_means: true
    pre_command_phase_may_be_reported_separately:
      - launch_wait
      - global_solve_time
      - estimator_warmup
    runtime_metrics_require_after_first_command_filter:
      - localization_error
      - planner_belief_error
      - yaw_error
      - waypoint_tracking_error
      - detection_rate
      - rejected_correction_rate
      - obstacle_clearance
      - command_age
      - local_solve_time
    camera_state_freshness:
      state_available_does_not_imply_fresh_measurement: true
      require_state_age_s_and_state_fresh_when_logging: true
      require_pixel_pose_age_s_and_pixel_pose_fresh_when_logging: true
      freshness_threshold_source: pixel_timeout_s
      paper_tables_should_separate:
        - fresh_camera_state_error
        - stale_latest_state_error
        - planner_truth_belief_error
      planner_relevant_localization_metric: truth_belief_error_m

  artifact_rules:
    gp_artifact_must_record:
      - schema_version
      - source_samples
      - source_targets
      - world
      - camera_setup
      - kernel
      - length_scale
      - noise_variance
      - beta
      - grid_shape
    yolo_model_must_record:
      - dataset_path
      - train_val_split
      - model_path
      - inference_threshold

  forbidden_silent_behaviors:
    - silently_using_non_yolo_perception_in_paper_launch
    - silently_falling_back_to_profile_gp_artifact
    - silently_plotting_schematic_trajectory_when_run_trace_missing
    - silently_counting_timeout_as_goal_success
    - silently_clipping_gp_queries_without_diagnostic
    - silently_continuing_without_camera_geometry
    - mission_waypoints_for_route_choice
    - constant_R_efe_without_ambiguity
    - visibility_dependent_multistart_candidates
