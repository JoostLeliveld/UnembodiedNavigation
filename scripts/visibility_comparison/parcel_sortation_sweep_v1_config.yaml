# Parcel-sortation C2 hyperparameter sweep — enable front-lane initial commit.
#
# Driver: scripts/visibility_comparison/run_model_selection.py
# Output root: logs/visibility_comparison/parcel_sortation_sweep_v1/
#
# Sweep axes (3D grid, 18 cells, single seed for scoping):
#   - horizon                   : 80, 120, 200
#   - goal_tightening_power     : 0.20, 0.45, 0.80
#   - goal_prior_u_std_start
#     = goal_prior_v_std_start  : 500, 1000
#
# Held fixed: ambiguity_weight=3.0, r_miss_uv=120, goal_prior_*_final=200,
# GP artifact = parcel_sortation_gp_v1, YOLO = yolo_simseg_parcel_v1.
# Task = shadow_tradeoff_sortation_discriminating, Planner = C2.

base:
  world: parcel_sortation.world.sdf
  launch_file: warehouse_primary_comparison.launch.py
  task: shadow_tradeoff_sortation_discriminating
  planner: visibility_aware_efe          # C2 only
  seeds: [0]

  # Locked planner / EFE settings (mirror parcel_sortation_campaign_config.yaml).
  horizon: 40                            # cells will override to 80/120/200
  dt: 0.25
  discount_gamma: 0.98
  process_noise_xy: 0.01
  process_noise_theta: 0.02
  observation_risk_scale: 1.25
  ambiguity_term_scale: 1.0
  control_weight: 0.0
  risk_weight_obs: 1.0
  ambiguity_weight: 3.0
  r_visible_uv: 2.5
  r_miss_uv: 120.0

  # Goal prior — cells override start values and goal_tightening_power.
  goal_prior_u_std_start: 250.0          # cells override
  goal_prior_v_std_start: 250.0          # cells override
  goal_prior_u_std_final: 200.0
  goal_prior_v_std_final: 200.0
  goal_tightening_power: 0.45            # cells override

  goal_success_radius: 0.20
  goal_success_hold_s: 2.0
  run_timeout_after_first_cmd_s: 75.0
  auto_stop_on_goal: true

  optimizer_maxiter: 50
  optimizer_maxfun: 300
  optimizer_ftol: 1.0e-6
  optimizer_gtol: 1.0e-4
  optimizer_warm_start: true

  use_command_noise: true
  use_encoder_noise: true
  use_odom_for_predict: true
  odom_topic: /odom_noisy
  command_noise_linear_slip_mean: 0.03
  command_noise_linear_slip_std: 0.06
  command_noise_angular_slip_mean: 0.00
  command_noise_angular_slip_std: 0.04
  command_noise_linear_additive_std: 0.008
  command_noise_angular_additive_std: 0.035
  command_noise_correlation_alpha: 0.85
  use_odom_heading_correction: true
  use_displacement_heading: false
  heading_min_displacement_m: 0.10
  heading_bev_noise_sigma_m: 0.05

  # Perception (parcel_sortation-specific).
  perception_backend: yolo
  yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/yolo_simseg_parcel_v1/model.pt"
  yolo_imgsz: 640
  yolo_conf_threshold: 0.10
  yolo_iou_threshold: 0.45
  yolo_target_class: robot
  yolo_class_id: -1
  yolo_use_masks: true
  yolo_min_mask_area_px: 12.0
  yolo_mask_bottom_band_px: 3.0

  # GP artifact + expected beta (required by run_model_selection.py preflight).
  gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/parcel_sortation_gp_v1/yolo_score_raw_gp.npz"
  expected_gp_beta: 1.0

  # Continuous belief logging (10 Hz).
  belief_publish_rate: 10.0

  # Inter-run hygiene.
  cleanup_sim_stragglers: true
  reset_world: true

# 18 cells: horizon × goal_tightening_power × goal_prior_start (u=v).
# axis="grid_h_gtp_gps" so they all show up under one logical sweep axis.
cells:
  # ---- horizon=80 ----
  - axis: grid_h_gtp_gps
    label: h80_gtp020_gps500
    overrides: {horizon: 80, goal_tightening_power: 0.20, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h80_gtp020_gps1000
    overrides: {horizon: 80, goal_tightening_power: 0.20, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h80_gtp045_gps500
    overrides: {horizon: 80, goal_tightening_power: 0.45, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h80_gtp045_gps1000
    overrides: {horizon: 80, goal_tightening_power: 0.45, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h80_gtp080_gps500
    overrides: {horizon: 80, goal_tightening_power: 0.80, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h80_gtp080_gps1000
    overrides: {horizon: 80, goal_tightening_power: 0.80, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}

  # ---- horizon=120 ----
  - axis: grid_h_gtp_gps
    label: h120_gtp020_gps500
    overrides: {horizon: 120, goal_tightening_power: 0.20, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h120_gtp020_gps1000
    overrides: {horizon: 120, goal_tightening_power: 0.20, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h120_gtp045_gps500
    overrides: {horizon: 120, goal_tightening_power: 0.45, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h120_gtp045_gps1000
    overrides: {horizon: 120, goal_tightening_power: 0.45, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h120_gtp080_gps500
    overrides: {horizon: 120, goal_tightening_power: 0.80, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h120_gtp080_gps1000
    overrides: {horizon: 120, goal_tightening_power: 0.80, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}

  # ---- horizon=200 ----
  - axis: grid_h_gtp_gps
    label: h200_gtp020_gps500
    overrides: {horizon: 200, goal_tightening_power: 0.20, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h200_gtp020_gps1000
    overrides: {horizon: 200, goal_tightening_power: 0.20, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h200_gtp045_gps500
    overrides: {horizon: 200, goal_tightening_power: 0.45, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h200_gtp045_gps1000
    overrides: {horizon: 200, goal_tightening_power: 0.45, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
  - axis: grid_h_gtp_gps
    label: h200_gtp080_gps500
    overrides: {horizon: 200, goal_tightening_power: 0.80, goal_prior_u_std_start: 500.0, goal_prior_v_std_start: 500.0}
  - axis: grid_h_gtp_gps
    label: h200_gtp080_gps1000
    overrides: {horizon: 200, goal_tightening_power: 0.80, goal_prior_u_std_start: 1000.0, goal_prior_v_std_start: 1000.0}
