# New recorded drives for the interpretation comparison.
#
# These exist so the hull, learned-NN and quality-gated interpretations can be compared on
# camera readings that none of them has ever seen. The earlier comparison replayed one
# archived drive; that drive is not reused here, and nothing in this campaign reads it.
#
# All three interpretations are OFFLINE replays scored afterwards on the same recorded
# readings, so the runtime condition is identical across them: none of them steers the
# robot, alters fusion, or changes the recorded trajectory. The single runtime condition
# below therefore uses the same fixed-offset observation model as the diagnostic repeat
# drives, and every difference between the compared columns is interpretation, not physics.
#
# Three frozen routes and three motion/noise seeds, because one drive is not a result.
world: warehouse_v2.world.sdf
launch_file: warehouse_primary_comparison.launch.py

# Variant of the interpretation comparison in which the drive is STEERED by the shape
# model rather than by the uncorrected box. The reason is empirical: `raw_box` reaches the
# goal in only 13 of 24 historical runs, because a 27 cm uncorrected bias fed to the EKF
# as if unbiased drives the belief error to over a metre and the robot into a rack. Those
# drives are short and cover only the first part of each route.
#
# Steering with `hull` (106 of 117 historical runs reach the goal) buys full-route
# coverage. The readings themselves are unaffected: each camera still reports the same
# bounding box, and every interpretation is replayed offline from that same raw
# back-projection, so the compared columns remain mutually comparable.
#
# The cost, which must be stated wherever this variant is used: the trajectory was chosen
# by a well-localized robot, so the readings come from places such a robot visits. This
# answers "how good is this reading" and NOT "which arm survives the drive".
conditions:
  H1:
    label: H1_hull_steered_raw_readings_replayed
    manager_fusion_rule: joint_network
    manager_observation_model: hull
    manager_fixed_offset_m: 0.0

