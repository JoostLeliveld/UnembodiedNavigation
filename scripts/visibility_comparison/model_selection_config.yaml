# Model-selection sensitivity grid for the visibility-aware planner.
#
# All cells run on Task A only (the headline shadow-tradeoff task) with seeds
# 0..4. Nominal points are NOT rerun here:
#   r_miss=120, beta=0.75, Q_xy=0.01, ambiguity=3.0 come from C2 anchor.
#   ambiguity=0.0 comes from C3 anchor.
#
# Run the fresh raw-GP anchor campaign separately in a new log root, e.g.
# logs/visibility_comparison/paper_campaign_rawgp_v1.

base:
  world: warehouse_occ_light.world.sdf
  launch_file: warehouse_primary_comparison.launch.py
  task: shadow_tradeoff_a
  planner: visibility_aware_efe       # C2; ambiguity term ON
  seeds: [0, 1, 2, 3, 4]

  # Locked planner / EFE settings (must match the paper campaign except
  # where the sensitivity axes override them)
  horizon: 40
  dt: 0.25
  discount_gamma: 0.98
  process_noise_xy: 0.01              # nominal Q_xy
  process_noise_theta: 0.02
  observation_risk_scale: 1.25
  ambiguity_term_scale: 1.0
  control_weight: 0.0
  risk_weight_obs: 1.0
  ambiguity_weight: 3.0               # nominal lambda_amb
  r_visible_uv: 2.5
  r_miss_uv: 120.0                    # nominal r_miss
  visibility_sigma_kappa: 1.0

  goal_success_radius: 0.20
  goal_success_hold_s: 2.0
  run_timeout_after_first_cmd_s: 75.0
  auto_stop_on_goal: true

  optimizer_maxiter: 50
  optimizer_maxfun: 300
  optimizer_ftol: 1.0e-6
  optimizer_gtol: 1.0e-4
  optimizer_warm_start: true

  use_command_noise: true
  command_noise_linear_slip_mean: 0.03
  command_noise_linear_slip_std: 0.06
  command_noise_angular_slip_mean: 0.00
  command_noise_angular_slip_std: 0.04
  command_noise_linear_additive_std: 0.008
  command_noise_angular_additive_std: 0.035
  command_noise_correlation_alpha: 0.85

  # Perception
  perception_backend: yolo
  yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/yolo_simseg_smoke/model.pt"
  yolo_imgsz: 640
  yolo_conf_threshold: 0.10           # aligned with GP capture threshold
  yolo_iou_threshold: 0.45
  yolo_target_class: robot
  yolo_class_id: -1
  yolo_use_masks: true
  yolo_min_mask_area_px: 12.0
  yolo_mask_bottom_band_px: 3.0

  # Default GP artifact (β = 0.75)
  gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/current_gp/yolo_score_raw_gp.npz"
  expected_gp_beta: 0.75

  # Continuous belief logging (10 Hz)
  belief_publish_rate: 10.0

# Sensitivity cells. Each cell is a (axis, label, override-dict).
# Override keys are forwarded as launch args unless the runner marks them as
# metadata. Keep this grid to exactly seven non-nominal cells (35 runs).
cells:
  # --- r_miss sweep (most important axis) ---
  - axis: r_miss_uv
    label: r_miss_uv_60
    overrides:
      r_miss_uv: 60.0
  - axis: r_miss_uv
    label: r_miss_uv_200
    overrides:
      r_miss_uv: 200.0

  # --- conservative discount β sweep ---
  - axis: gp_beta
    label: gp_beta_0p0
    expected_gp_beta: 0.0
    overrides:
      gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/gp_beta_variants/beta0p0/yolo_score_raw_gp.npz"
  - axis: gp_beta
    label: gp_beta_1p25
    expected_gp_beta: 1.25
    overrides:
      gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/gp_beta_variants/beta1p25/yolo_score_raw_gp.npz"

  # --- process noise Q_xy sweep ---
  - axis: process_noise_xy
    label: Q_xy_low
    overrides:
      process_noise_xy: 0.0025
  - axis: process_noise_xy
    label: Q_xy_high
    overrides:
      process_noise_xy: 0.04

  # --- ambiguity scale sweep ---
  - axis: ambiguity_weight
    label: ambiguity_high
    overrides:
      ambiguity_weight: 5.0
