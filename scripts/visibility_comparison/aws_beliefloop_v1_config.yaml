# hierarchical_beliefloop_v1 config (EXPLORATORY, 2026-06-03). AWS benchmark.
#
# METHODOLOGICAL CORRECTION (neutral hypothesis test, NOT outcome engineering).
# The locked runtime (aws_paper_final_config.yaml) solves the global EFE ONCE then
# runs a proportional follower, so later belief updates no longer affect planning --
# the runtime is not fully belief-closed, contradicting the receding-horizon
# formulation in the paper (predict/correct EKF belief feeding an EFE that "replans
# after the next belief update"). This config restores belief-closed replanning with
# a hierarchical scheme and is used to TEST a neutral question, not to force a result:
#   Does a learned state-dependent external-camera observation covariance change
#   long-horizon EFE route choice and belief quality, when executed by a SHARED,
#   CONDITION-NEUTRAL local belief-space controller, under a fixed task, fixed
#   estimator path, fixed local executor, and pre-registered validity criteria?
# We report route class, belief error, covariance, valid completion, and safety, and
# let the data decide. We do NOT promise or design a C1 collision.
#
# Architecture:
#  - GLOBAL EFE = visibility-aware route planner (H50/dt0.4, ~12 m). The ONLY C1/C2
#    difference lives here: GP-modulated predicted observation covariance for C2 vs
#    constant R for C1 (visibility_weight=0; GP via covariance, not a reward).
#  - LOCAL executor = CONDITION-NEUTRAL short-horizon belief-space tracker
#    (H8/dt0.25): risk-to-waypoint + belief-tube no-go + traversability + a shared
#    goal-progress guard. NO GP, NO ambiguity; J_local is IDENTICAL for C1 and C2.
#  - Runtime EKF correction R is SHARED across conditions (Stage C source change);
#    the GP enters only the global planning rollout. Belief-quality differences then
#    arise from the chosen route changing the actual measurement stream.
#
# Changes vs aws_paper_final_config.yaml (locked):
#   use_simple_local_controller: true -> false   (belief-closed local executor)
#   local_horizon:               6    -> 8        (~2 s / ~1.2 m lookahead)
#   local_optimizer_maxiter:     30   -> 45       (headroom for the local solve)
#   local_use_obs_risk:          (T)  -> false    (KEY: drop the observation-space
#       pixel goal prior in the local layer; it caused the aisle-transition freeze
#       and a ~0.42 m final-approach stall. The local follower then tracks via a
#       STATE-space goal cost + belief-tube no-go.)
#   local_goal_progress_weight:  (0)  -> 0.5      (the state-space ||m_xy-target||^2
#       tracking term; condition-neutral, no GP/visibility, identical for C1/C2.)
# local_use_visibility_model and local_use_ambiguity stay false (condition-neutral).
# Stage B (triggered global re-solve, global_dt/H50) params are added once the source
# change lands; this file currently exercises Stage A (local executor + freeze fix).
#
# VALIDATION: engineering gates (offline freeze check, single-seed smoke) are NOT
# scientific evidence. The frozen scientific campaign uses fixed seeds/methods/metrics
# with no tuning after seeing C1/C2 outcomes.
#
# Run (offline gate first; Gazebo only after explicit approval):
#   python3 scripts/visibility_comparison/run_visibility_campaign.py \
#     --config scripts/visibility_comparison/aws_beliefloop_v1_config.yaml \
#     --log-root logs/visibility_comparison/hierarchical_beliefloop_v1 \
#     --run-timeout 300

world: warehouse_aws.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R
  C2:
    planner: visibility_aware_efe
    label: C2_visibility_aware
  C3:
    planner: risk_only_ablation
    label: C3_risk_only_ambiguity_off

tasks:
  F31_b1_apron_a3_mid:
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]

perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_imgsz: 480
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0

gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/aws_gp_v5/yolo_score_raw_gp.npz"

headless: true
use_rviz: false
reset_world: false
ros_domain_id_base: 120
cleanup_sim_stragglers: true

use_displacement_heading: false
use_odom_heading_correction: true
odom_heading_timeout_s: 2.0
heading_min_displacement_m: 0.10
heading_bev_noise_sigma_m: 0.05
bev_y_calibration_offset_m: 0.05
pixel_max_correction_jump_m: 0.50

use_nogo_cost: true
nogo_weight: 200.0
nogo_safe_distance: 0.30
nogo_penalty_type: log_barrier
nogo_logbarrier_scale: 0.10
nogo_logbarrier_eps: 0.01
use_belief_nogo_cost: true
nogo_belief_kappa: 2.0

horizon: 20
dt: 0.25
v_max: 0.60
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.046
init_belief_sigma_xy: 0.05
init_belief_sigma_theta: 0.05
risk_weight_obs: 1.0
r_visible_uv: 2.5
r_miss_uv: 40.0
ambiguity_weight: 8.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0
goal_prior_u_std_final: 8.0
goal_prior_v_std_final: 8.0
goal_tightening_power: 0.45
pixel_timeout_s: 1.25
skip_stale_pixel_correction: true

robot_collision_radius_m: 0.125

use_hierarchical: true
# ROBUST PATH (2026-06-03): the per-cycle nonlinear local belief-EFE MPC proved
# fragile in the Gazebo loop on this 6-core host (idle/turn freeze, spin, ~370 ms
# contended solves, and the safety gate vs reference-segment mismatch) and offline
# could not predict runtime behaviour across 6 smokes. Decision: the LOCAL layer is
# the proven fast proportional tracker (reaches goals, ~0 ms, no freeze/spin); the
# belief-closed receding-horizon replanning that the paper's section 4/6 require is
# moved to the GLOBAL level (triggered re-solve on the live EKF belief, Stage B).
# The reference-tracker objective remains implemented but weight-gated OFF here.
use_simple_local_controller: true
local_tracking_use_odom_yaw: true
global_horizon: 80
local_horizon: 8
local_plan_rate: 2.5
cmd_publish_rate: 10.0
local_optimizer_maxiter: 45
# DISCLOSED engineering guard (condition-neutral, shared across C1/C2/C3): a metric
# ||m_xy - target||^2 forward-progress term that prevents the stationary v=0 local
# optimum when the tracked waypoint is beyond the short local horizon. No GP/visibility.
local_goal_progress_weight: 0.0
# LOCAL reference-segment TRACKER (condition-neutral, no GP/visibility/ambiguity;
# identical for C1/C2/C3). Replaces the single-point goal cost that gave no heading
# gradient and made the unicycle spin at the first ~90 deg turn. The reference
# segment is sampled OUTSIDE the solve along the global planner-derived waypoint
# polyline (known 2D route). ref_weight pulls the predicted mean onto the segment,
# terminal_ref_weight anchors the horizon end, du_weight smooths the controls.
# Tuned offline (scripts/visibility_comparison/test_ref_tracker_offline.py): per-step
# ref_weight dominates the terminal weight so the tracker hugs the route corridor
# (the occluded mid_cross_lane y=1.5 corridor is tight; over-weighting the terminal
# point cut the corner into the forbidden band and safe-stopped). 10/4 turns,
# advances, and reaches the final waypoint on BOTH the occluded and visible routes.
local_ref_weight: 10.0
local_terminal_ref_weight: 4.0
local_du_weight: 0.5
global_use_ambiguity: true
local_use_ambiguity: false
# Clean state-space local follower: drop the OBSERVATION-space goal risk (the pixel
# goal prior that caused the aisle-transition freeze + ~0.42 m final-approach stall).
# The local layer tracks the waypoint via the state-space goal cost + belief-tube no-go;
# visibility/observation reasoning stays in the global EFE. Condition-neutral.
local_use_obs_risk: false
global_optimizer_multistart: true
local_optimizer_multistart: false
local_use_visibility_model: false
local_use_belief_nogo_cost: true
local_nogo_penalty_type: log_barrier
# Lowered 80 -> 40 so the reference-segment pull can carry the unicycle through the
# first ~90 deg aisle-transition turn instead of being overwhelmed by the belief-tube
# barrier (which gave no heading gradient and forced rotate-in-place). Still a hard
# enough 2-sigma keep-out that leaving the driveable floor is unattractive. Shared
# across C1/C2/C3. Tuned offline (see waypoint-tracking gate).
local_nogo_weight: 40.0
local_nogo_safe_distance: 0.30
local_goal_prior_u_std_start: 4.0
local_goal_prior_v_std_start: 4.0
local_goal_prior_u_std_final: 2.0
local_goal_prior_v_std_final: 2.0
waypoint_spacing_m: 0.40
waypoint_arrival_radius_m: 0.20
latency_compensate_plan_handoff: true
local_replan_min_remaining_s: 0.0
local_replan_on_waypoint_change: false

optimizer_maxiter: 80
optimizer_maxfun: 480
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true
optimizer_multistart: true
optimizer_multistart_include_direct: false
optimizer_multistart_lateral_offsets: "-1.0,1.0"
optimizer_initial_routes_json: '[{"name":"mid_cross_lane","waypoints":[[3.3,1.5],[1.5,1.5],[1.0,1.75]]},{"name":"lower_sweep_lane","waypoints":[[3.3,-2.2],[1.2,-2.2],[1.0,1.75]]}]'

stuck_window_s: 20.0
stuck_max_displacement_m: 0.08
stuck_max_goal_improvement_m: 0.05
stuck_cmd_fraction_min: 0.5
stuck_idle_cmd_fraction_max: 0.10

goal_success_radius: 0.25
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 300.0
auto_stop_on_goal: true

use_command_noise: true
use_encoder_noise: true
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
