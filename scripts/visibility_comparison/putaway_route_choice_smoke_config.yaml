# Putaway warehouse route-choice smoke run.
#
# Purpose:
#   First C1/C2 check for warehouse_putaway.world.sdf after the AWS visual
#   mesh pass and real putaway GP capture. This is exploratory validation, not
#   paper evidence yet.
#
# Scientific guardrail:
#   No mission waypoints. C1 and C2 receive the same start, goal, known
#   forbidden-zone layer, and optimizer settings. Any route difference must come
#   from the planner-facing covariance induced by the learned observation
#   reliability GP.
#
# Run:
#   python3 scripts/visibility_comparison/run_visibility_campaign.py \
#     --config scripts/visibility_comparison/putaway_route_choice_smoke_config.yaml \
#     --log-root logs/visibility_comparison/warehouse_putaway_route_choice_smoke_v1

world: warehouse_putaway.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R
  C2:
    planner: visibility_aware_efe
    label: C2_visibility_aware

tasks:
  shadow_tradeoff_putaway_discriminating:
    conditions: [C1, C2]
    seeds: [1]

# --- Perception ---
perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_imgsz: 640
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0

# Required by the shared runner, ignored by C1.
gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/warehouse_putaway_gp_v2/yolo_score_raw_gp.npz"

# --- Runtime display ---
headless: true
use_rviz: false
reset_world: false
ros_domain_id_base: 110
cleanup_sim_stragglers: true

# --- Heading: odometry-backed, same estimator family as Task A ---
use_displacement_heading: false
use_odom_heading_correction: true
heading_min_displacement_m: 0.10
heading_bev_noise_sigma_m: 0.05

# --- Known 2D traversability / no-go layer ---
use_nogo_cost: true
nogo_weight: 160.0
nogo_safe_distance: 0.35
nogo_penalty_type: softplus
nogo_softplus_scale: 0.06
use_belief_nogo_cost: true
nogo_belief_kappa: 1.0

# --- Planner ---
# Putaway requires a longer route-level lookahead than the compact benchmark.
# A wider goal prior keeps temporary detours from being punished as impossible
# before the planner reaches the visible route payoff.
horizon: 60
dt: 0.35
v_max: 0.22
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.02
risk_weight_obs: 1.0
r_visible_uv: 2.5
r_miss_uv: 15.0
ambiguity_weight: 6.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0
goal_prior_u_std_start: 120.0
goal_prior_v_std_start: 120.0
goal_prior_u_std_final: 60.0
goal_prior_v_std_final: 60.0
goal_tightening_power: 0.70

robot_collision_radius_m: 0.125

# --- Optimizer ---
optimizer_maxiter: 90
optimizer_maxfun: 700
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true

stuck_window_s: 24.0
stuck_max_displacement_m: 0.08
stuck_max_goal_improvement_m: 0.05
stuck_cmd_fraction_min: 0.5

# --- Stopping ---
goal_success_radius: 0.30
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 240.0
auto_stop_on_goal: true

# --- Command noise ---
use_command_noise: false
use_encoder_noise: false
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
