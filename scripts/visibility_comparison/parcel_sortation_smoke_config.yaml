# Parcel-sortation warehouse geometry smoke run.
#
# Purpose:
#   First headless check for parcel_sortation.world.sdf after rebuilding the
#   scene into a realistic parcel/induction/sort-wall layout. This is a
#   geometry, perception-start, and local-controller smoke test only.
#
# Scientific status:
#   This config intentionally runs C1 only until a parcel_sortation-specific
#   visibility capture and GP artifact exist. Do not use the old putaway GP for
#   C2 evidence.

world: parcel_sortation.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R

tasks:
  shadow_tradeoff_sortation_discriminating:
    conditions: [C1]
    seeds: [1]

# Perception: robot detector only. GP below is ignored by C1 but required by
# the campaign runner schema.
perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_imgsz: 640
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0
gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/warehouse_putaway_gp_v2/yolo_score_raw_gp.npz"

headless: true
use_rviz: false
reset_world: false
ros_domain_id_base: 130
cleanup_sim_stragglers: true

use_displacement_heading: false
use_odom_heading_correction: true
heading_min_displacement_m: 0.10
heading_bev_noise_sigma_m: 0.05

# Known 2D traversability / forbidden-zone layer.
use_nogo_cost: true
nogo_weight: 100.0
nogo_safe_distance: 0.25
nogo_penalty_type: softplus
nogo_softplus_scale: 0.06
use_belief_nogo_cost: true
nogo_belief_kappa: 1.0

# Short local horizon: enough for smooth AMR motion without making the
# optimizer solve the entire warehouse route at each step.
horizon: 28
dt: 0.25
v_max: 0.20
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.02
risk_weight_obs: 1.0
r_visible_uv: 2.5
r_miss_uv: 15.0
ambiguity_weight: 3.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.005
goal_prior_u_std_start: 100.0
goal_prior_v_std_start: 100.0
goal_prior_u_std_final: 40.0
goal_prior_v_std_final: 40.0
goal_tightening_power: 0.65

robot_collision_radius_m: 0.125

optimizer_maxiter: 45
optimizer_maxfun: 350
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true

stuck_window_s: 18.0
stuck_max_displacement_m: 0.08
stuck_max_goal_improvement_m: 0.05
stuck_cmd_fraction_min: 0.5

goal_success_radius: 0.30
goal_success_hold_s: 1.5
run_timeout_after_first_cmd_s: 140.0
auto_stop_on_goal: true

use_command_noise: false
use_encoder_noise: false
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
