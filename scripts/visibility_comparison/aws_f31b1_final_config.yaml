# FINAL F31_b1 main-comparison config (2026-06-10).
# = LATEST a0/F87 runtime VERBATIM (camera_xy_only, warning_band nogo keep_in,
#   aws_gp_v7, no lateral offsets, global_horizon 120) on the locked world
#   (camera z=4.8, y=-5.5; cleaned geometry). ONLY the task + route seeds are
#   F31_b1-specific. a0 line is saved separately (aws_f86a_camera_xy_config.yaml).
world: warehouse_aws.world.sdf
launch_file: warehouse_primary_comparison.launch.py
conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R
  C2:
    planner: visibility_aware_efe
    label: C2_visibility_aware

tasks:
  F31_b1_apron_a3_mid:
    conditions: [C1, C2]
    seeds: [0]

perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_device: "0"
yolo_imgsz: 640
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0
keypoint_marker_world_z: 0.0

gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/aws_gp_v7/yolo_score_raw_gp.npz"
headless: true
use_rviz: false
reset_world: false
ros_domain_id_base: 183
cleanup_sim_stragglers: true
debug_runtime: true
debug_log_period_s: 0.25

driveable_geometry_json: '{"prisms":[{"name":"loading_apron_drive_lane","xmin":-5.6,"xmax":5.1,"ymin":-3.45,"ymax":-2.85,"zmin":0.0,"zmax":0.1},{"name":"lower_main_aisle","xmin":-5.65,"xmax":5.15,"ymin":-2.85,"ymax":-2.03,"zmin":0.0,"zmax":0.1},{"name":"upper_cross_aisle","xmin":-5.65,"xmax":4.85,"ymin":4.28,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"west_service_lane","xmin":-5.65,"xmax":-4.6,"ymin":-3.45,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"east_far_corner_route","xmin":4.65,"xmax":5.15,"ymin":-3.45,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"rack_aisle_A1","xmin":-3.475,"xmax":-2.575,"ymin":-2.85,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"rack_aisle_A2","xmin":-1.425,"xmax":-0.525,"ymin":-2.85,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"rack_aisle_A3","xmin":0.625,"xmax":1.525,"ymin":-2.85,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"rack_aisle_A4","xmin":2.575,"xmax":3.675,"ymin":-2.85,"ymax":4.8,"zmin":0.0,"zmax":0.1},{"name":"connector_A1_A2_R2gap","xmin":-2.8,"xmax":-1.2,"ymin":1.25,"ymax":2.2,"zmin":0.0,"zmax":0.1},{"name":"connector_A2_A3_R3gap","xmin":-0.75,"xmax":0.85,"ymin":1.25,"ymax":2.2,"zmin":0.0,"zmax":0.1},{"name":"connector_A3_A4_R4gap","xmin":1.3,"xmax":2.8,"ymin":1.25,"ymax":2.2,"zmin":0.0,"zmax":0.1},{"name":"connector_A4_east_R5gap","xmin":3.45,"xmax":4.875,"ymin":1.25,"ymax":2.2,"zmin":0.0,"zmax":0.1}],"model_name":"driveable_region_a1_a2_blocked_mid"}'

# F86a: correct odom architecture — odom used for dead-reckoning prediction only,
# NOT as a separate explicit yaw measurement. camera_xy_only mode lets pixel (u,v)
# updates influence heading indirectly through cross-covariance S_{xθ}, S_{yθ}
# generated by the unicycle prediction Jacobian. No separate yaw anchor is applied.
heading_update_mode: camera_xy_only
use_odom_heading_correction: false
use_state_bev_heading_correction: false
use_state_bev_yaw: false
use_displacement_heading: false
local_tracking_use_odom_yaw: true
odom_heading_timeout_s: 2.0
heading_min_displacement_m: 0.1
heading_bev_noise_sigma_m: 0.05
bev_y_calibration_offset_m: 0.05
pixel_max_correction_jump_m: 0.5
use_odom_for_predict: true

use_nogo_cost: true
nogo_mode: keep_in
# warning_band (hinged-log): phi = near_weight*log(1+(max(b-c,0)/b)^2)
#                                  + weight*(max(-c,0)/eps)^2
# Exactly ZERO for valid interior states with clearance c >= b (=warning_band),
# so raising `nogo_weight` crushes violations WITHOUT biasing the choice between
# two fully valid routes (the log_barrier interior bias was what collapsed the
# C2 split at weight>200 — it always preferred the wider aisle). Keeps a familiar
# log shape only inside the thin warning band near the boundary.
nogo_weight: 2000.0
nogo_safe_distance: 0.15
nogo_penalty_type: warning_band
nogo_warning_band: 0.05
nogo_near_weight: 50.0
nogo_softplus_scale: 0.08
nogo_logbarrier_scale: 0.01
nogo_logbarrier_eps: 0.01
use_belief_nogo_cost: false
nogo_belief_kappa: 2.0

horizon: 20
dt: 0.25
v_max: 0.6
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.046
init_belief_sigma_xy: 0.05
init_belief_sigma_theta: 0.05
risk_weight_obs: 1.0
r_visible_uv: 2.5
r_miss_uv: 40.0
ambiguity_weight: 18.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0
goal_prior_u_std_start: 50.0
goal_prior_v_std_start: 50.0
goal_prior_u_std_final: 12.0
goal_prior_v_std_final: 12.0
goal_tightening_power: 0.45
pixel_timeout_s: 1.25
skip_stale_pixel_correction: true
robot_collision_radius_m: 0.125

use_hierarchical: true
use_simple_local_controller: true
global_horizon: 120
local_horizon: 6
local_plan_rate: 5.0
cmd_publish_rate: 10.0
local_optimizer_maxiter: 30
global_use_ambiguity: true
local_use_ambiguity: false
global_optimizer_multistart: true
local_optimizer_multistart: false
local_use_visibility_model: false
local_use_belief_nogo_cost: true
local_nogo_penalty_type: log_barrier
local_nogo_weight: 1000.0
local_nogo_safe_distance: 0.20
local_goal_prior_u_std_start: 4.0
local_goal_prior_v_std_start: 4.0
local_goal_prior_u_std_final: 2.0
local_goal_prior_v_std_final: 2.0
waypoint_spacing_m: 0.12
waypoint_arrival_radius_m: 0.10
latency_compensate_plan_handoff: false
local_replan_min_remaining_s: 0.0
local_replan_on_waypoint_change: false

optimizer_maxiter: 120
optimizer_maxfun: 720
optimizer_ftol: 1.0e-06
optimizer_gtol: 0.0001
optimizer_warm_start: true
optimizer_multistart: true
optimizer_multistart_include_direct: false
# Lateral offsets removed: +/-1m east shifts the south route initial trajectory through
# the non-driveable shelf corner (x=-4.6 to -3.5, y=-2 to -1), creating a 6.48M-penalty
# starting point that 120 L-BFGS iterations can't fully resolve back to the corridor.
# The two explicit named routes (nw_blind, south_visible) are sufficient multistart coverage.
optimizer_multistart_lateral_offsets: 0.0
optimizer_initial_routes_json: '[{"name":"mid_cross_lane","waypoints":[[3.3,1.5],[1.5,1.5],[1.0,1.75]]},{"name":"lower_sweep_lane","waypoints":[[3.3,-2.2],[1.2,-2.2],[1.0,1.75]]}]'

stuck_window_s: 20.0
stuck_max_displacement_m: 0.08
stuck_max_goal_improvement_m: 0.05
stuck_cmd_fraction_min: 0.5
stuck_idle_cmd_fraction_max: 0.1
goal_success_radius: 0.25
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 300.0
auto_stop_on_goal: true

use_command_noise: true
use_encoder_noise: true
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.0
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
encoder_noise_angular_slip_std: 0.16
encoder_noise_angular_additive_std: 0.1
