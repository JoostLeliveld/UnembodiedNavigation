# Exploratory-disabled Experiment B / AWS warehouse campaign.
#
# Do not use this as paper evidence yet. The AWS line first needs final R4/A4
# geometry, AWS detector validation, GP recapture, smoke validation, seeded
# logs, and figures. The compact benchmark remains the paper core.
#
# Intended campaign: C1 vs C2 on redesigned B1 plus secondary stress tasks.
#
# B1 now starts in the shipping/apron decision lane. The short A4 route remains
# physically driveable but passes behind the R4/A4 high stack. The neighboring
# A3 route is a modest detour through a more observable aisle before crossing
# back at the mid cross-aisle.
#
# World: AWS/JDeRobot-style exploratory shelf section adapted for gz-sim, with
#        split rack rows, dock doors, explicit green visual-only driveable
#        boundaries, red non-driveable box spots, staging pads, a pallet jack,
#        and one high R4 stack. The wall-side red staging pads are non-driveable;
#        the green driveable apron lane is pulled north of them. The shorter B1
#        route is physically legal but camera-poor behind the R4 stack; the
#        longer candidate uses A3 and the mid cross-aisle.
# Camera: high camera mounted at the middle of the south/loading wall at 5.80 m,
#         pitched downward to see both the racks and the dock apron.
#         Geometric visibility uses a robot marker height of 0.35 m.
#
# BEFORE RUNNING ANY INTERPRETABLE AWS BATCH:
#   A. Train/validate the AWS-specific detector at
#      logs/perception_models/aws_yolo_simseg_v2/model.pt. The Task A detector
#      can produce false visual fixes in the AWS scene and must not be used for
#      paper evidence.
#   B. Fit the AWS-specific GP artifact. Keep it separate from
#      logs/visibility_comparison/current_gp, which is the compact Task A
#      artifact.
#
#   1. Launch the AWS world/camera in one terminal.
#   2. Capture a simulator-segmentation detector dataset:
#        python3 scripts/perception/capture_simseg_dataset.py \
#          --world warehouse_aws.world.sdf \
#          --out logs/perception_datasets/aws_simseg_v2 \
#          --sample-nx 24 --sample-ny 20 --yaw-samples 4 \
#          --min-mask-area 12.0
#        24x20=480 candidate positions; region filter (auto from known_2d_regions)
#        skips rack footprints, keeping ~276 positions x 4 yaws = ~1104 raw captures.
#        --min-mask-area 12.0 matches the inference threshold (yolo_min_mask_area_px).
#   3. Fine-tune the detector:
#        python3 scripts/perception/train_yolo_seg.py \
#          --data logs/perception_datasets/aws_simseg_v2/data.yaml \
#          --base-model logs/perception_models/yolo_simseg_smoke/model.pt \
#          --out logs/perception_models/aws_yolo_simseg_v2 \
#          --epochs 30 --imgsz 640 --device 0
#        Use --device cpu if no GPU is available.
#   4. Capture shared visibility samples:
#        python3 scripts/visibility_comparison/capture_visibility_samples.py \
#          --world warehouse_aws.world.sdf \
#          --out logs/visibility_comparison/aws_capture_v5 \
#          --sample-nx 24 --sample-ny 20 --yaw-samples 4 \
#          --target-height-m 0.35
#   5. Extract YOLO scores:
#        python3 scripts/visibility_comparison/extract_perception_targets.py \
#          --capture-dir logs/visibility_comparison/aws_capture_v5 \
#          --out logs/visibility_comparison/aws_targets_v5 \
#          --model logs/perception_models/aws_yolo_simseg_v2/model.pt \
#          --conf-threshold 0.10
#   6. Build GP targets:
#        python3 scripts/visibility_comparison/build_gp_targets.py \
#          --perception-targets logs/visibility_comparison/aws_targets_v5/perception_targets.csv \
#          --out logs/visibility_comparison/aws_gp_targets_v5
#   7. Fit the planner artifact:
#        python3 scripts/visibility_comparison/fit_visibility_gps.py \
#          --gp-targets logs/visibility_comparison/aws_gp_targets_v5/gp_targets_xy_aggregated.csv \
#          --capture-manifest logs/visibility_comparison/aws_capture_v5/capture_manifest.json \
#          --out logs/visibility_comparison/aws_gp_v5 \
#          --grid-nx 220 --grid-ny 200 \
#          --gp-length-scale 1.20 --gp-noise-var 0.10 --beta 1.0

world: warehouse_aws.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R
  C2:
    planner: visibility_aware_efe
    label: C2_visibility_aware

tasks:
  B1_clean_route_choice:
    conditions: [C1, C2]
    seeds: [0, 1, 2, 3, 4]
  B2_reacquire_after_occlusion:
    conditions: [C1, C2]
    seeds: [0, 1, 2]
  B3_long_horizon_far_corner:
    conditions: [C1, C2]
    seeds: [0, 1, 2]

# --- Perception ---
perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_imgsz: 640
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0

# --- GP artifact ---
gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/aws_gp_v5/yolo_score_raw_gp.npz"

# --- Runtime display ---
headless: true
use_rviz: false
# The campaign runner starts a fresh Gazebo process for every run and assigns
# a fresh ROS_DOMAIN_ID, so the optional Gazebo control reset is kept off for
# the paper-facing batch.
reset_world: false
ros_domain_id_base: 100
cleanup_sim_stragglers: true

# --- Heading: odometry-backed, same as the current paper-facing Task A runs ---
use_displacement_heading: false
use_odom_heading_correction: true
heading_min_displacement_m: 0.10
heading_bev_noise_sigma_m: 0.05

# --- Obstacle avoidance ---
# Explicit: visibility_launch_common.py resolves a missing use_nogo_cost key as
# 'auto' -> False, silently disabling wall/rack avoidance regardless of fallback
# defaults. Must be set explicitly here to prevent collisions.
use_nogo_cost: true
nogo_weight: 80.0
nogo_safe_distance: 0.22
nogo_penalty_type: softplus
nogo_softplus_scale: 0.06
use_belief_nogo_cost: true
nogo_belief_kappa: 1.0

# --- Planner ---
# Conservative AWS defaults for the redesigned B1 geometry.
horizon: 40
dt: 0.25
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.02
risk_weight_obs: 1.0
ambiguity_weight: 2.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0
r_visible_uv: 2.5
r_miss_uv: 15.0
goal_prior_u_std_final: 4.0
goal_prior_v_std_final: 4.0
goal_tightening_power: 0.45
robot_collision_radius_m: 0.125

# --- Optimizer ---
optimizer_maxiter: 80
optimizer_maxfun: 500
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true

# --- Stopping (timeout extended for 11.0 x 10.0 m room traversal) ---
goal_success_radius: 0.25
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 150.0
auto_stop_on_goal: true

# --- Command noise (same as IWAI campaign) ---
use_command_noise: true
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
