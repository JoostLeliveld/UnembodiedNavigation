# SANITY — visible_aisle_sanity_aws straight-line task (7.7m southern apron).
# Bottom-up sanity check: validate controller + estimator on a trivial open-floor
# task before returning to the B1 route. F65-derived params (calibration + jump
# rejection + NIS). Used for Stage 1 (offline), Stage 3 (truth-loc), Stage 4 (full).
#
# Purpose:
#   F57 showed 100% route differentiation (all C1 seeds north, all C2 seeds
#   south) and near-zero heading error after the odom_heading_timeout fix.
#   However, C2 crashed in all 3 seeds due to the local EFE tracker entering
#   non-driveable zones:
#     - seed0: drifted into R4U rack (x=1.60,y=2.23) near the goal approach
#     - seed2: cut through shelf_end_box_spot_R4 (x=2.07,y=-1.50) on
#              the first south leg
#   Root cause: local_nogo_safe_distance=0.13m < typical truth-belief error
#   (0.15-0.20m). The local planner thinks it has 0.13m clearance but truth
#   is already inside the obstacle.
#
# Changes vs F58:
#   local_nogo_safe_distance: 0.13 -> 0.30  (covers 0.20m localisation error)
#   local_optimizer_maxiter:  45   -> 20    (faster warm-started solves)
#   local_replan_min_remaining_s: 1.0 -> 0.5  (replan sooner)
#   seeds: [0,1,2] -> [0,1,2,3,4]             (more statistics)
#
# Scientific intent:
#   Still follows paper contract: external camera (x,y), heading from odom.
#   No visibility model in local planner. Route choice from global EFE only.
#
# Scientific intent:
#   This still follows the paper-facing contract: the external camera supplies
#   (x,y) position updates; heading comes from odometry. It does not add IMU,
#   keypoint heading, waypoint forcing, GP recapture, or task/world changes.
#
# F49 outcome:
#   C1 collided after entering the visibility-poor/risky behavior.
#   C2 reached the goal with the visibility-aware route.
#
# This F55 config keeps the F50 planner, task, detector, GP, and seeds fixed.
#   The only runtime-method addition is explicit idle no-progress detection, so
#   safe-stop/no-progress can finish as `stuck` instead of wall-clock invalid.
#
# Inherited purpose:
#   F44 showed that several local-controller/timing params were not recorded or
#   not passed into the agent. This run keeps the paper-faithful local EFE
#   tracker, but makes the execution path diagnosable and reduces timing
#   pressure:
#
#   - local tracking yaw uses fresh odometry yaw, matching the paper statement
#     that visual localization contributes (x,y) while heading comes from odom;
#   - global multistart remains enabled for route choice;
#   - local multistart is disabled because waypoint tracking should be a fast
#     warm-started local control problem, not a second route-choice search;
#   - local horizon is H12 with maxiter=45;
#   - the local tracker uses a tighter waypoint prior than the global route
#     planner, because F48 showed zero-control "successful" local solves when
#     the local planner inherited the loose global goal prior;
#   - active plan handoff compensates solver latency;
#   - local replanning is skipped while >1s of a valid tape remains.
#
# The global EFE route-choice problem is unchanged.
#
# Run:
#   python3 scripts/visibility_comparison/run_visibility_campaign.py \
#     --config scripts/visibility_comparison/aws_f65_calibrated_config.yaml \
#     --log-root logs/visibility_comparison/f65_calibrated_v1 \
#     --run-timeout 300
#
# ---- inherited notes from F35/F40 lineage ----
#
# Purpose:
#   F34 belief_uncertainty_bands.pdf showed that when YOLO corrections go stale
#   (C1 in rack shadow), the EKF dead-reckons with process_noise_theta=0.02 rad/step
#   which is 2.3x smaller than actual angular encoder noise (~0.046 rad/step from
#   ang_slip_std=0.030 + ang_additive_std=0.035). The belief diverges to x=20m, y=8m
#   while truth stays at x=3m, y=2m. The 2sigma band grows but tracks the WRONG value.
#
#   Fix: set process_noise_theta = 0.046 (= sqrt(0.030^2 + 0.035^2), matches spec).
#   Expected: during stale corrections, EKF uncertainty grows faster, 2sigma band
#   widens enough to contain truth, nogo_belief_kappa cost activates sooner.
#
# Change vs F34:
#   process_noise_theta: 0.02 → 0.046
#
# Run:
#   python3 scripts/visibility_comparison/run_visibility_campaign.py #     --config scripts/visibility_comparison/aws_f35_b1_route_choice_config.yaml #     --log-root logs/visibility_comparison/f35_b1_route_choice_v1 #     --run-timeout 400
#
# Purpose:
#   F32 local solves were 2600-3600ms because r_visible_uv=8.0 (R=64px²) and
#   control_weight=0.05 caused the compiled CasADi function to evaluate ~165ms
#   per call vs ~43ms with the original r_vis=2.5 parameters. With 3.5s solves
#   the plan (H=10, dt=0.25 → 2.5s) exhausted before the next arrived, causing
#   stop-start motion and poor trajectory tracking.
#
#   F33 reverts these two parameters to restore ~900ms local solves.
#   Plan duration (2.5s) > solve time (0.9s) → no exhaustion → smooth motion.
#
# Changes vs F32:
#   r_visible_uv:   8.0  → 2.5   (original value; restores CasADi compilation quality)
#   control_weight: 0.05 → 0.0   (zero allows CasADi dead-code elimination of ctrl term)
#
# Run:
#   python3 scripts/visibility_comparison/run_visibility_campaign.py \
#     --config scripts/visibility_comparison/aws_f33_b1_route_choice_config.yaml \
#     --log-root logs/visibility_comparison/f35_b1_route_choice_v1 \
#     --run-timeout 400
#
# Task and route seeds unchanged from F32:
#   task: F31_b1_apron_a3_mid (start 3.3,-1.0,yaw=0 → goal 1.0,1.75)
#   mid_cross_lane:   (3.3,1.5)→(1.5,1.5)→goal  [northern gap, P~0.07, short]
#   lower_sweep_lane: (3.3,-2.2)→(1.2,-2.2)→goal [south apron, P~0.65, long]

# PLACEHOLDER — replaced below
#   goal A3-mid (1.0, 1.75). F23 offline showed C2 preferring the southern
#   sweep route while C1 went direct north. This is the first closed-loop test
#   where the visibility model has a real route-choice decision to make.
#
# Changes vs F30:
#   - task: F24_R01_a4_lower_to_a3_mid -> F31_b1_apron_a3_mid
#     start: (3.125,-2.44,yaw=2.036) -> (3.30,-1.00,yaw=0.0) facing east
#     goal:  (1.075, 1.64)           -> (1.00, 1.75)
#   - optimizer_initial_routes_json: updated for new start position
#     mid_cross_lane:   direct north from (3.3,-1.0) through A4/A3 cross-aisle
#     lower_sweep_lane: south to lower apron then northwest to goal
#   All F30 runtime safeguards kept unchanged.
#
# Run:
#   python3 scripts/visibility_comparison/run_visibility_campaign.py \
#     --config scripts/visibility_comparison/aws_f31_b1_route_choice_config.yaml \
#     --log-root logs/visibility_comparison/f31_b1_route_choice_v1 \
#     --run-timeout 400

world: warehouse_aws.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: C1_constant_R
  C2:
    planner: visibility_aware_efe
    label: C2_visibility_aware

tasks:
  visible_aisle_sanity_aws:
    conditions: [C1, C2]
    seeds: [0]

perception_backend: yolo
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/aws_yolo_simseg_v2/model.pt"
yolo_imgsz: 640
yolo_conf_threshold: 0.10
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0

gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/aws_gp_v5/yolo_score_raw_gp.npz"

headless: true
use_rviz: false
reset_world: false
ros_domain_id_base: 120
cleanup_sim_stragglers: true

use_displacement_heading: false
use_odom_heading_correction: true
odom_heading_timeout_s: 2.0
heading_min_displacement_m: 0.10
heading_bev_noise_sigma_m: 0.05
# Empirical y-axis calibration offset — corrects oblique-camera back-projection bias.
# Derived from N=346 ground-truth synchronized detections (F37v3): mean y-bias = -0.127m.
bev_y_calibration_offset_m: 0.127
# Reject single-step pixel corrections that would move the belief more than
# this threshold — prevents near-rack YOLO centroid instability from scattering
# the belief (F64 diagnostic: near-rack jumps observed up to 2 m).
pixel_max_correction_jump_m: 0.50

use_nogo_cost: true
nogo_weight: 200.0
nogo_safe_distance: 0.30
nogo_penalty_type: log_barrier
nogo_logbarrier_scale: 0.10
nogo_logbarrier_eps: 0.01
use_belief_nogo_cost: true
nogo_belief_kappa: 2.0

horizon: 20
dt: 0.25
v_max: 0.60
discount_gamma: 0.98
belief_publish_rate: 10.0
process_noise_xy: 0.01
process_noise_theta: 0.046
init_belief_sigma_xy: 0.05
init_belief_sigma_theta: 0.05
risk_weight_obs: 1.0
r_visible_uv: 2.5
r_miss_uv: 40.0
ambiguity_weight: 8.0
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0
goal_prior_u_std_final: 8.0
goal_prior_v_std_final: 8.0
goal_tightening_power: 0.45
pixel_timeout_s: 1.25
skip_stale_pixel_correction: true

robot_collision_radius_m: 0.125

use_hierarchical: true
use_simple_local_controller: false
local_tracking_use_odom_yaw: true
global_horizon: 80
local_horizon: 6
local_plan_rate: 5.0
cmd_publish_rate: 10.0
local_optimizer_maxiter: 30
global_use_ambiguity: true
local_use_ambiguity: false
global_optimizer_multistart: true
local_optimizer_multistart: false
local_use_visibility_model: false
local_use_belief_nogo_cost: true
local_nogo_penalty_type: log_barrier
local_nogo_weight: 80.0
local_nogo_safe_distance: 0.30
local_goal_prior_u_std_start: 4.0
local_goal_prior_v_std_start: 4.0
local_goal_prior_u_std_final: 2.0
local_goal_prior_v_std_final: 2.0
waypoint_spacing_m: 0.40
waypoint_arrival_radius_m: 0.20
latency_compensate_plan_handoff: false
local_replan_min_remaining_s: 0.0
local_replan_on_waypoint_change: false

optimizer_maxiter: 80
optimizer_maxfun: 480
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true
optimizer_multistart: true
optimizer_multistart_include_direct: false
optimizer_multistart_lateral_offsets: "-1.0,1.0"
optimizer_initial_routes_json: '[{"name":"mid_cross_lane","waypoints":[[3.3,1.5],[1.5,1.5],[1.0,1.75]]},{"name":"lower_sweep_lane","waypoints":[[3.3,-2.2],[1.2,-2.2],[1.0,1.75]]}]'

stuck_window_s: 20.0
stuck_max_displacement_m: 0.08
stuck_max_goal_improvement_m: 0.05
stuck_cmd_fraction_min: 0.5
stuck_idle_cmd_fraction_max: 0.10

goal_success_radius: 0.25
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 300.0
auto_stop_on_goal: true

use_command_noise: true
use_encoder_noise: true
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
