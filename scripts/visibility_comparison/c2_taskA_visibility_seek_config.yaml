    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140
      ambiguity_weight: 6.0

  - axis: combined_h40
    label: h40_rmiss300_goal_loose_amb10
    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140
      ambiguity_weight: 10.0

  # 5) Horizon check: same clean EFE candidates, modestly longer lookahead.
  - axis: combined_h70
    label: h70_rmiss200_goal_loose_amb6
    overrides:
      horizon: 70
      r_miss_uv: 200.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140
      ambiguity_weight: 6.0

  - axis: combined_h70
    label: h70_rmiss200_goal_loose_amb10
    overrides:
      horizon: 70
      r_miss_uv: 200.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
