# C2 Task-A visibility-seeking sweep.
#
# Purpose:
#   Find a visibility-aware EFE setting that makes Task A trade path length for
#   lower nominal raw-GP low-rho exposure. This is intentionally exploratory and
#   C2-only; it is not the locked paper model-selection grid.
#
# Screening cost:
#   24 cells x 1 seed = 24 runs. If one cell clearly wins, rerun that cell with
#   seeds 0..4 before using it in the paper.

expected_cells: 24

base:
  world: warehouse_occ_light.world.sdf
  launch_file: warehouse_primary_comparison.launch.py
  task: shadow_tradeoff_a
  planner: visibility_aware_efe
  seeds: [0]

  horizon: 40
  dt: 0.25
  discount_gamma: 0.98
  process_noise_xy: 0.01
  process_noise_theta: 0.02

  # Nominal C2 values.
  observation_risk_scale: 1.25
  ambiguity_term_scale: 1.0
  risk_weight_obs: 1.0
  ambiguity_weight: 3.0
  control_weight: 0.0
  r_visible_uv: 2.5
  r_miss_uv: 120.0
  visibility_sigma_kappa: 1.0

  # Nominal goal-prior schedule.
  goal_prior_u_std_start: 80.0
  goal_prior_v_std_start: 80.0
  goal_prior_u_std_final: 4.0
  goal_prior_v_std_final: 4.0
  goal_tightening_power: 0.45
  goal_progress_n_steps: 90
  goal_sigma_uv: 2.0
  # Keep clean EFE: no terminal-progress leash or auxiliary route penalty.
  min_terminal_goal_progress_m: 0.0

  goal_success_radius: 0.20
  goal_success_hold_s: 2.0
  run_timeout_after_first_cmd_s: 75.0
  auto_stop_on_goal: true

  optimizer_maxiter: 70
  optimizer_maxfun: 450
  optimizer_ftol: 1.0e-6
  optimizer_gtol: 1.0e-4
  optimizer_warm_start: true

  use_command_noise: true
  command_noise_linear_slip_mean: 0.03
  command_noise_linear_slip_std: 0.06
  command_noise_angular_slip_mean: 0.00
  command_noise_angular_slip_std: 0.04
  command_noise_linear_additive_std: 0.008
  command_noise_angular_additive_std: 0.035
  command_noise_correlation_alpha: 0.85

  perception_backend: yolo
  yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/perception_models/yolo_simseg_smoke/model.pt"
  yolo_imgsz: 640
  yolo_conf_threshold: 0.10
  yolo_iou_threshold: 0.45
  yolo_target_class: robot
  yolo_class_id: -1
  yolo_use_masks: true
  yolo_min_mask_area_px: 12.0
  yolo_mask_bottom_band_px: 3.0

  gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/logs/visibility_comparison/current_gp/yolo_score_raw_gp.npz"
  expected_gp_beta: 0.75
  belief_publish_rate: 10.0

cells:
  # 1) Main effect: missed-observation penalty.
  - axis: r_miss_uv
    label: rmiss_160
    overrides:
      r_miss_uv: 160.0

  - axis: r_miss_uv
    label: rmiss_200
    overrides:
      r_miss_uv: 200.0

  - axis: r_miss_uv
    label: rmiss_250
    overrides:
      r_miss_uv: 250.0

  - axis: r_miss_uv
    label: rmiss_300
    overrides:
      r_miss_uv: 300.0

  # 2) Main effect: goal-prior schedule, paired with the two most likely r_miss
  # levels. No terminal-progress leash; this remains clean EFE.
  - axis: goal_prior
    label: rmiss200_goal_mid
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120

  - axis: goal_prior
    label: rmiss300_goal_mid
    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120

  - axis: goal_prior
    label: rmiss200_goal_loose
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140

  - axis: goal_prior
    label: rmiss300_goal_loose
    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140

  # 3) Main effect: ambiguity weight with stronger R inflation.
  - axis: ambiguity_weight
    label: rmiss200_amb6
    overrides:
      r_miss_uv: 200.0
      ambiguity_weight: 6.0

  - axis: ambiguity_weight
    label: rmiss200_amb10
    overrides:
      r_miss_uv: 200.0
      ambiguity_weight: 10.0

  - axis: ambiguity_weight
    label: rmiss300_amb6
    overrides:
      r_miss_uv: 300.0
      ambiguity_weight: 6.0

  - axis: ambiguity_weight
    label: rmiss300_amb10
    overrides:
      r_miss_uv: 300.0
      ambiguity_weight: 10.0

  # 4) Combined candidates at nominal horizon=40.
  - axis: combined_h40
    label: h40_rmiss200_goal_mid_amb6
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120
      ambiguity_weight: 6.0

  - axis: combined_h40
    label: h40_rmiss200_goal_mid_amb10
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120
      ambiguity_weight: 10.0

  - axis: combined_h40
    label: h40_rmiss200_goal_loose_amb6
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140
      ambiguity_weight: 6.0

  - axis: combined_h40
    label: h40_rmiss200_goal_loose_amb10
    overrides:
      r_miss_uv: 200.0
      goal_prior_u_std_start: 150.0
      goal_prior_v_std_start: 150.0
      goal_prior_u_std_final: 8.0
      goal_prior_v_std_final: 8.0
      goal_tightening_power: 1.0
      goal_progress_n_steps: 140
      ambiguity_weight: 10.0

  - axis: combined_h40
    label: h40_rmiss300_goal_mid_amb6
    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120
      ambiguity_weight: 6.0

  - axis: combined_h40
    label: h40_rmiss300_goal_mid_amb10
    overrides:
      r_miss_uv: 300.0
      goal_prior_u_std_start: 120.0
      goal_prior_v_std_start: 120.0
      goal_prior_u_std_final: 6.0
      goal_prior_v_std_final: 6.0
      goal_tightening_power: 0.75
      goal_progress_n_steps: 120
