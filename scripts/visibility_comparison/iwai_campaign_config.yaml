# IWAI Campaign Hyperparameter Lock
# All values below are fixed before the first run.
# If ANY value changes after a run has been executed, the entire campaign restarts.
# Fill in [FILL] entries before running — do not leave them blank.

world: warehouse_occ_light.world.sdf
launch_file: warehouse_primary_comparison.launch.py

# --- Conditions ---
# C1: constant-R0 baseline (visibility_unaware_baseline)
# C2: full GP-EFE with ambiguity (efe1, use_ambiguity=true)
# C3: GP-risk only, no ambiguity (gp_risk_only, use_ambiguity=false)
conditions:
  C1:
    planner: visibility_unaware_baseline
    label: constant_R0
  C2:
    planner: efe1
    label: gp_efe
  C3:
    planner: gp_risk_only
    label: gp_risk_only

# --- Tasks and seeds ---
tasks:
  shadow_tradeoff_a:
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]
  shadow_tradeoff_b:
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]
  sanity_open:
    conditions: [C1, C2]
    seeds: [0, 1, 2]
# Total: 5×3 + 5×3 + 3×2 = 36 runs

# --- Perception ---
perception_backend: yolo
# Path to the trained YOLO model used during the GP capture.
# Must match the model used to fit the GP artifact.
yolo_model: "/home/joostleliveld/Thesis/UnembodiedNavigation/yolo11n-seg.pt"
yolo_imgsz: 640
yolo_conf_threshold: 0.25
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: -1
yolo_use_masks: true
yolo_min_mask_area_px: 12.0
yolo_mask_bottom_band_px: 3.0

# --- GP artifact ---
# Path to the fitted visibility GP .npz artifact (yolo_score_calibrated or yolo_score_raw).
# Used by C2 and C3; C1 ignores it.
gp_artifact: "/home/joostleliveld/Thesis/UnembodiedNavigation/src/experiments/data/visibility_gp/warehouse_occ_light_empirical_visibility_gp.npz"

# --- Planner / EFE hyperparameters ---
# These are the locked values from Section 0c of the pre-registration.
horizon: 40
dt: 0.25
discount_gamma: 0.98
process_noise_xy: 0.01
process_noise_theta: 0.02

# lambda_risk and lambda_amb in the paper map to the planner parameters below.
# Verify these mappings against the planner source before running.
# lambda_risk = 0.75  →  observation_risk_scale (current default 1.25 — VERIFY)
# lambda_amb  = 1.25  →  ambiguity_term_scale   (current default 1.00 — VERIFY)
# lambda_ctrl = 0.0   →  control_weight         (matches)
# Effective risk scale  = risk_weight_obs × observation_risk_scale = 1.0 × 1.25 = 1.25 (lambda_risk)
# Effective ambig scale = ambiguity_weight × ambiguity_term_scale  = 3.0 × 1.00 = 3.0  (lambda_amb)
# These are the empirically validated values from pre-campaign runs; update lambda table in paper.
observation_risk_scale: 1.25
ambiguity_term_scale: 1.0
control_weight: 0.0

# GP conservatism discount beta: set from GP uncertainty map inspection (Section 0a).
# In world_profiles.yaml this is visibility_beta (currently 1.0).
# beta: "[FILL: from GP uncertainty map inspection]"

# Observation noise endpoints (in pixel units, diagonal of R matrix).
# R_visible = diag([r_visible_uv^2, r_visible_uv^2])
# R_miss    = diag([r_miss_uv^2,    r_miss_uv^2])
r_visible_uv: 2.5
r_miss_uv: 120.0

# --- Optimizer ---
# Solve time with T=40 will be ~2-2.5 s per plan. Reduce maxiter to 50 to cut to ~1.4 s.
# Pre-campaign run with maxiter=80 reached goal (min dist 1.6 cm), so 50 is adequate.
# Disclose effective planning rate (~0.4 Hz) in the paper as an engineering caveat.
optimizer_maxiter: 50
optimizer_maxfun: 300
optimizer_ftol: 1.0e-6
optimizer_gtol: 1.0e-4
optimizer_warm_start: true

# --- Stopping logic ---
goal_success_radius: 0.20   # meters, sustained for goal_success_hold_s
goal_success_hold_s: 2.0
run_timeout_after_first_cmd_s: 75.0
auto_stop_on_goal: true

# --- Command noise (engineering, not a contribution) ---
use_command_noise: true
command_noise_linear_slip_mean: 0.03
command_noise_linear_slip_std: 0.06
command_noise_angular_slip_mean: 0.00
command_noise_angular_slip_std: 0.04
command_noise_linear_additive_std: 0.008
command_noise_angular_additive_std: 0.035
command_noise_correlation_alpha: 0.85
