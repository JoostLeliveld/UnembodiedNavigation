      cameras look south. The camera columns are brought inward to widen adjacent-camera overlap for validated handover. Generated by scripts/geometry_visibility/make_warehouse_full.py. Full dressed layout
      - real ShelfD/E mesh visual overlays on box-collision racks, a 4.5 m central aisle, one west-wall-backed one-sided shelf row, docks, staging clutter meshes, hanging lamps, blue site bounds, conservative
      green no-go envelopes, and asymmetric tall handover segments. The planner driveable union is the cyan aisle network documented on the generated map.
