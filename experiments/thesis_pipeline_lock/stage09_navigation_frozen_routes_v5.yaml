study_title: Thesis final commissioned-route Q0-versus-Q1 navigation campaign
study_comparison: P0 minimizes the frozen expected-belief objective without a commissioned-support gate. P1 additionally requires at least one camera with Stage-08 q>=0.5 along each sampled route pose and turn. Five matched stochastic seeds execute hash-bound routes with otherwise identical runtime perception, fusion, controller, and noise.
