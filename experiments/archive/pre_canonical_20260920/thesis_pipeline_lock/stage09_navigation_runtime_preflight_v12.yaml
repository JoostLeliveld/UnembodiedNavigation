study_title: Stage-09 960-pixel nuisance-yaw runtime preflight V12
study_comparison: Non-inferential execution preflight. Camera observations update map x/y only. After a point-yaw shape-only hull refusal, the unchanged gate may be evaluated inside the belief's two-sided 90-percent marginal-yaw interval; a boundary optimum is refused and heading is never updated. Timestamped odometry may bridge a longer camera outage only with complete motion support.
