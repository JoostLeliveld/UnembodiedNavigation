# Single-camera notebook capture routes, in the AWS warehouse.
#
# Method development belongs in this world (research/06_world_camera_design.md); the
# four-camera world evaluates frozen methods. The filter notebooks are method
# development, so this is where their capture belongs.
#
# ONE camera, `external_camera` in the world file, at (0.00, -5.50, 4.80) looking north
# with a 0.92 rad downward pitch and a 90 deg horizontal field of view. Its floor
# footprint runs from about 0.7 m in front of it to past the north wall, so a single
# drive can sweep the robot from 1.4 m to 10 m of range -- which is the variation that
# makes the observation covariance depend on where the robot is standing.
#
# Every route below is a straight line (the driver supports no other kind) and every one
# was checked against the rack collision boxes: racks sit at x = -4.05, -2.00, 0.05,
# 2.10, 4.15, each 0.55 m wide, spanning y in (-0.80, 1.25) lower and (2.20, 4.25)
# upper, with R1 also carrying a mid rack over (1.25, 2.20). Aisle centres are therefore
# x = -3.025, -0.975, 1.075, 3.125 with 1.5 m of clearance.
#
# CORRECTION 2026-08-14 -- the paragraph above is INCOMPLETE, and trusting it cost two
# captures. `warehouse_rack_occluders` carries 18 collision boxes, not 11: besides the
# rack rows there is a row of PALLET/END-CAP boxes standing in the apron in front of every
# column, at y in (-1.415, -1.115), x-bands (-4.260,-3.840) (-2.210,-1.790) (-0.160,+0.260)
# (+3.940,+4.360) -- and a larger three-box cluster at x = +2.00 reaching south to
# y = -1.665. So **the southernmost obstacle face in this world is y = -1.665, not -0.80**,
# and the open apron is only y < -1.665. Read the world SDF, not this comment, before
# placing a route:
#   src/sim/gazebo_worlds/worlds/warehouse_aws.world.sdf, model warehouse_rack_occluders.
# The four original routes are unaffected (they sit at y <= -4.30 or run up the aisles).
#
# Four different routes rather than four repeats of one: the notebook holds three drives
# back to commission R on and then asks what that R is worth on the fourth. If all four
# were the same line, "held out" would mean almost nothing.
study_id: filter_notebook_aws_single_camera_v1
world: warehouse_aws.world.sdf
world_name: warehouse_aws
camera_ids: [camera_A]
cameras:
  camera_A:
    mount: south wall, centre, 4.80 m, pitched 0.92 rad down, facing north
    world_include: external_camera
    image_topic: /external_camera/image_raw
    pixel_topic: /perception/camera_A/pixel_pose
    diagnostics_topic: /perception/camera_A/detection_diagnostics
    observation_topic: /perception/camera_observation/camera_A
    calibration_id: warehouse_aws_camera_A

collection:
  passive_only: true
  control_odom_topic: /odom
  operational_odom_topic: /odom_noisy
  duration_clock: simulation
  command_topic: /cmd_vel
  arrival_radius_m: 0.2
  start_hold_s: 2.0
  routes:
    - name: aisle_east_north
      purpose: >-
        THE ANALYSIS DRIVE. North up the aisle between the R3 and R4 rack columns,
        straight away from the camera: range sweeps 1.4 m to 10.0 m and the robot passes
        behind two rack rows on the way. Everything the notebook measures about one
        camera comes from this drive.
      start: {x: 1.075, y: -4.60, yaw: 1.5708}
      goal: {x: 1.075, y: 4.40}
    - name: apron_west_to_east
      purpose: >-
        Near-field lateral pass across the open apron, 1.2 m to 4.7 m of range. Almost
        pure bearing change at short range, which is where a pixel is worth the least
        floor.
      start: {x: -4.00, y: -4.30, yaw: 0.0}
      goal: {x: 4.00, y: -4.30}
    - name: aisle_west_north
      purpose: >-
        The mirror of the analysis drive, up the aisle between R2 and R3, so the robot is
        seen from the opposite side of the camera's centre line.
      start: {x: -0.975, y: -4.60, yaw: 1.5708}
      goal: {x: -0.975, y: 4.40}
    - name: mid_cross_east
      purpose: >-
        Far-field lateral pass along the cross-aisle between the lower and upper rack
        rows, 7.3 m to 8.7 m of range, partly seen over the lower racks. This is where a
        pixel is worth the most floor.
      start: {x: -0.90, y: 1.72, yaw: 0.0}
      goal: {x: 4.40, y: 1.72}
    # ---- The reversal pair, added 2026-08-14, for the HEADING question only.
    #
    # The four routes above sample only two headings, 0 deg and 90 deg, and each heading
    # sits in a different part of the floor -- so heading is confounded with position and
    # "the offset rotates with heading" rests on two points that differ in both.
    #
    # These two are THE SAME LINE driven in opposite directions. That is the whole design:
    # the point set, the ranges, the bearings from the camera and the occlusion are
    # identical to the metre, and the only thing that changes is where the robot is
    # pointing. A mirrored pair would NOT do this -- the camera sits at x = 0, so
    # reflecting a route about its own centre changes every range.
    #
    # The line lies entirely in the open apron SOUTH of the pallet row: every point has
    # y <= -2.10, clearing the southernmost obstacle face (y = -1.665) by 0.32 m after the
    # robot's 0.115 m half-diagonal, measured against all 18 collision boxes rather than
    # against the comment above. Range from the camera runs 2.72 m to 3.68 m either way.
    #
    # An earlier version of this pair ran to (0.10, -1.10) and was DISCARDED: that point is
    # 0.015 m from a pallet box, so the robot spawned inside it, was shoved 11.5 deg off
    # heading, and the forward drive stopped against the same box 0.42 m short. Both
    # captures were unusable. Do not move these endpoints north without re-running the
    # collision check against the world file.
    - name: apron_diagonal_ne
      purpose: >-
        45 deg heading. South-west to north-east across the open apron. Forward half of
        the reversal pair with apron_diagonal_sw.
      start: {x: -3.00, y: -4.55, yaw: 0.7854}
      goal: {x: -0.55, y: -2.10}
    - name: apron_diagonal_sw
      purpose: >-
        225 deg heading. The SAME line as apron_diagonal_ne, driven back the other way, so
        it differs from it in heading alone -- the controlled test of whether the offset is
        carried by the robot's body orientation.
      start: {x: -0.55, y: -2.10, yaw: -2.3562}
      goal: {x: -3.00, y: -4.55}
    # ---- TURNING routes, added 2026-08-14.
    #
    # Every route above is straight, which is the one condition under which the deployable
    # heading estimate -- the odometry path tangent -- is trivially good (measured 0.25 deg
    # median on the diagonals). Two ways that can break, and one route for each:
    #
    #   apron_corner_left  a sharp 90 deg corner. The follower's cosine taper zeroes forward
    #                      speed when the heading error exceeds 90 deg, so the robot ROTATES
    #                      IN PLACE at the corner -- and a stationary robot has no path
    #                      tangent at all. This is the case the motion gate silently drops.
    #   apron_arc_left     a 1.5 m-radius quarter arc, so the robot turns CONTINUOUSLY while
    #                      still moving at speed. Here the tangent exists but LAGS, because
    #                      it averages the direction over a window.
    #
    # These are polylines, not start/goal pairs. The follower has always tracked an
    # arbitrary waypoint list and steers toward each point in turn; the note above about the
    # driver supporting "no other kind" than straight lines was WRONG -- only
    # `drive_study_route.load_route` restricted it, and it now accepts a `waypoints:` list.
    # The exact path driven does not need to be precise: heading is scored per detection
    # against truth, so any genuinely curved path answers the question.
    - name: apron_corner_left
      purpose: >-
        Sharp 90 deg left corner in the open apron: 3.0 m east, rotate in place, 2.1 m
        north. Tests the heading estimate where the robot is turning but not translating.
      start: {x: -3.50, y: -4.30, yaw: 0.0}
      waypoints:
        - {x: -0.50, y: -4.30}
        - {x: -0.50, y: -2.20}
    # MEASURED 2026-08-14, and it corrects the comment above: apron_corner_left does NOT
    # rotate in place. The taper zeroes forward speed only while the heading error exceeds
    # 90 deg, and at a 90 deg corner the error falls below that immediately, so the robot
    # arcs through at up to 62 deg/s while still translating. To force a genuine in-place
    # rotation the turn must be MORE than 90 deg, which is what this route is for: the
    # second leg doubles back, needing ~144 deg, so the robot must spin ~54 deg on the spot
    # before the taper lets it move. This is the only case where the path tangent does not
    # merely lag but does not exist.
    - name: apron_reverse_spin
      purpose: >-
        Drive east, then double back to a waypoint 144 deg away, forcing a stationary
        in-place rotation before the robot can move again. Tests the heading estimate where
        there is no path tangent at all.
      start: {x: -3.00, y: -4.30, yaw: 0.0}
      waypoints:
        - {x: -1.00, y: -4.30}
        - {x: -2.50, y: -3.20}
    # ---- OCCLUSION routes, added 2026-08-17.
    #
    # Every route above is either fully visible (100% detection) or fully blocked in
    # patches (mid_cross_east: 48% clean, 16% partial, 37% hidden). Neither isolates the
    # case that actually corrupts a measurement rather than removing it:
    #
    #   hidden   the camera sees nothing            -> no detection, no harm done
    #   partial  the camera sees the robot's TOP    -> a detection DOES arrive, but the
    #            but not where it touches the floor    box bottom is the bottom of the
    #                                                  VISIBLE part, so the measurement
    #                                                  is displaced, and nothing in the
    #                                                  data says so
    #
    # `partial` is the dangerous one and no existing route samples it well. These were
    # not placed by hand: `check_route_clearance.py` reads all 22 collision boxes from the
    # world SDF, ray-tests the camera against the robot's contact point and its 0.191 m
    # top at every point of a candidate line, and the two below are the maximum of a scan
    # over x for north-south lines and over y for lateral ones.
    #
    # The scan is validated against reality: it predicts mid_cross_east at 64% visible
    # (48 clean + 16 partial) and that capture measured 58%.
    - name: graze_aisle_north
      purpose: >-
        THE OCCLUSION DRIVE. North up the R1/R2 aisle but held 0.09 m east of the aisle
        centre, so the sightline from the camera grazes the top edge of the R2 rack for
        part of the run. Scanned optimum: 31% of the drive has the robot's contact point
        hidden while its top is still visible, and 0% is fully hidden -- so a detection
        arrives for every frame and roughly a third of them are displaced. Range 3.1 m to
        10.2 m. Clearance 0.505 m, the widest of any route in this file.
      start: {x: -2.92, y: -4.60, yaw: 1.5708}
      goal: {x: -2.92, y: 4.30}
    - name: graze_aisle_south
      purpose: >-
        The SAME line as graze_aisle_north driven back, so the occlusion pattern, the
        ranges and the bearings are identical to the metre and only the heading changes.
        The reversal control for the occlusion drive, in the same spirit as the
        apron_diagonal pair.
      start: {x: -2.92, y: 4.30, yaw: -1.5708}
      goal: {x: -2.92, y: -4.60}
    - name: cross_aisle_full_east
      purpose: >-
        Lateral pass along the cross-aisle behind the lower rack row, full width rather
        than mid_cross_east's eastern half: 7.8 m across four rack shadows and the gaps
        between them. Mixture of all three regimes (50% clean, 12% partial, 38% hidden),
        so it is the drive where a filter has to cope with losing the camera repeatedly
        AND with some of what it gets back being displaced.
      start: {x: -3.40, y: 1.72, yaw: 0.0}
      goal: {x: 4.40, y: 1.72}
    - name: cross_aisle_full_west
      purpose: >-
        cross_aisle_full_east driven back the other way. Heading control for the mixed
        occlusion drive.
      start: {x: 4.40, y: 1.72, yaw: 3.14159}
      goal: {x: -3.40, y: 1.72}
    - name: apron_arc_left
      purpose: >-
        Continuous 90 deg left turn on a 1.5 m radius, entered and left on a straight, so
        the robot is turning at full speed throughout the arc. Tests tangent LAG rather
        than tangent absence.
      start: {x: -3.20, y: -4.60, yaw: 0.0}
      waypoints:
        - {x: -2.2, y: -4.6}
        - {x: -1.812, y: -4.549}
        - {x: -1.45, y: -4.399}
        - {x: -1.139, y: -4.161}
        - {x: -0.901, y: -3.85}
        - {x: -0.751, y: -3.488}
        - {x: -0.7, y: -3.1}
        - {x: -0.7, y: -2.1}
  repeats_per_route: 1
