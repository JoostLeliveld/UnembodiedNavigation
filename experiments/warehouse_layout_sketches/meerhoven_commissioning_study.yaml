study_id: meerhoven_twelve_camera_commissioning_v1
world: warehouse_meerhoven.world.sdf
world_name: warehouse_meerhoven
camera_ids: [camera_A, camera_B, camera_C, camera_D, camera_E, camera_F, camera_G, camera_H, camera_I, camera_J, camera_K, camera_L]

# These waypoint-controlled passes are commissioning-data collection only. The
# C1/C2 evaluation missions in tasks.yaml remain direct start/goal tasks with no
# route-forcing waypoint chain.
collection:
  passive_only: true
  control_odom_topic: /odom
  operational_odom_topic: /odom_noisy
  duration_clock: simulation
  command_topic: /cmd_vel
  arrival_radius_m: 0.20
  start_hold_s: 2.0
  lateral_offsets_m: [0.0]
  speeds_mps: [0.16]
  routes:
    - name: commission_aisle2_fit
      evidence_role: fit
      purpose: north-to-haul pass through a double-stacked picking aisle
      start: {x: -7.4, y: 7.8, yaw: -1.5708}
      goal: {x: -7.4, y: -4.9}
    - name: commission_haul_fit
      evidence_role: fit
      purpose: west-to-east full haul-lane handover pass
      start: {x: -7.4, y: -4.9, yaw: 0.0}
      goal: {x: 12.2, y: -4.9}
    - name: commission_pack_fit
      evidence_role: fit
      purpose: pack-line and under-mezzanine horizontal pass
      start: {x: 1.4, y: -9.0, yaw: 0.0}
      goal: {x: 12.2, y: -9.0}
    - name: commission_east_returns_fit
      evidence_role: fit
      purpose: east service lane from pack zone to returns
      start: {x: 12.2, y: -9.0, yaw: 1.5708}
      goal: {x: 12.2, y: 4.4}
    - name: commission_west_qualification
      evidence_role: qualification
      purpose: route-disjoint west service-lane validation
      start: {x: -13.6, y: -4.9, yaw: 1.5708}
      goal: {x: -13.6, y: 7.9}
    - name: commission_haul_qualification_reverse
      evidence_role: qualification
      purpose: reverse-direction haul-lane validation
      start: {x: 12.2, y: -4.9, yaw: 3.14159}
      goal: {x: -13.6, y: -4.9}
    - name: commission_returns_qualification_reverse
      evidence_role: qualification
      purpose: reverse-direction east service-lane validation
      start: {x: 12.2, y: 4.4, yaw: -1.5708}
      goal: {x: 12.2, y: -9.0}

artifacts:
  scheduling_prior: logs/studies/warehouse_layout_sketches/meerhoven_scheduling_prior_v1/meerhoven_geometry_12cam.npz
  detector_dataset: logs/perception_datasets/warehouse_meerhoven_yolo_12cam_v1
  detector_model: logs/perception_models/warehouse_meerhoven_yolo_12cam_v1/model.pt
  projection_calibration: logs/studies/warehouse_layout_sketches/meerhoven_projection_calibration_v1/projection_calibration.json
  gp_root: logs/studies/warehouse_layout_sketches/meerhoven_gp_v1
