<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px sans-serif;fill:#172033}.sub{font:18px sans-serif;fill:#334155}
      .head{font:700 21px sans-serif;fill:#172033}.body{font:16px sans-serif;fill:#334155}
      .box{stroke:#475569;stroke-width:2;rx:16}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="620" fill="#f8fafc"/>
  <text x="750" y="45" text-anchor="middle" class="title">One planner, six sources of future observation reliability</text>
  <text x="750" y="76" text-anchor="middle" class="sub">Only the source of p_use,c(s) changes</text>

  <rect class="box" x="35" y="125" width="260" height="365" fill="#e2e8f0"/>
  <text x="165" y="160" text-anchor="middle" class="head">Available information</text>
  <text x="60" y="205" class="body">• candidate pose</text><text x="60" y="235" class="body">• camera calibration</text>
  <text x="60" y="265" class="body">• optional sensed structure</text><text x="60" y="295" class="body">• optional past observations</text>
  <text x="60" y="350" class="body">Never operational:</text><text x="60" y="380" class="body">future detector outcome</text>
  <text x="60" y="410" class="body">or simulator truth</text>

  <line class="arrow" x1="295" y1="307" x2="350" y2="307"/>
  <rect class="box" x="355" y="105" width="390" height="405" fill="#fff"/>
  <text x="550" y="140" text-anchor="middle" class="head">Reliability source</text>
  <rect x="385" y="165" width="155" height="65" rx="10" fill="#dbeafe"/><text x="462" y="192" text-anchor="middle" class="body">constant /</text><text x="462" y="216" text-anchor="middle" class="body">distance</text>
  <rect x="560" y="165" width="155" height="65" rx="10" fill="#cffafe"/><text x="637" y="204" text-anchor="middle" class="body">FOV / range</text>
  <rect x="385" y="250" width="155" height="65" rx="10" fill="#fde68a"/><text x="462" y="289" text-anchor="middle" class="body">depth / raycast</text>
  <rect x="560" y="250" width="155" height="65" rx="10" fill="#ddd6fe"/><text x="637" y="289" text-anchor="middle" class="body">Gaussian process</text>
  <rect x="385" y="335" width="155" height="65" rx="10" fill="#bbf7d0"/><text x="462" y="374" text-anchor="middle" class="body">hybrid</text>
  <rect x="560" y="335" width="155" height="65" rx="10" fill="#fecaca"/><text x="637" y="362" text-anchor="middle" class="body">CAD reference</text><text x="637" y="386" text-anchor="middle" class="body">evaluation only</text>
  <text x="550" y="455" text-anchor="middle" class="sub">Output: top-down p_use map + support/age</text>

  <line class="arrow" x1="745" y1="307" x2="800" y2="307"/>
  <rect class="box" x="805" y="160" width="285" height="295" fill="#f3e8ff"/>
  <text x="947" y="198" text-anchor="middle" class="head">Common belief model</text>
  <text x="830" y="245" class="body">Expected hit/miss update:</text>
  <text x="830" y="280" class="body">E[P⁺] = p_use P_hit</text><text x="900" y="310" class="body">+ (1−p_use) P_miss</text>
  <text x="830" y="360" class="body">Same R_cond, process model,</text><text x="830" y="390" class="body">freshness and planner costs</text>

  <line class="arrow" x1="1090" y1="307" x2="1145" y2="307"/>
  <rect class="box" x="1150" y="125" width="315" height="365" fill="#dcfce7"/>
  <text x="1307" y="165" text-anchor="middle" class="head">Planner-visible consequence</text>
  <text x="1180" y="215" class="body">1. reliability-weighted belief</text><text x="1180" y="250" class="body">2. predicted uncertainty</text>
  <text x="1180" y="285" class="body">3. route alternatives</text><text x="1180" y="320" class="body">4. selected global plan</text>
  <text x="1180" y="375" class="body">Compare on identical:</text><text x="1180" y="405" class="body">start, goal, map and route set</text>
  <text x="750" y="570" text-anchor="middle" class="sub">Supervisor story: what is known → what field is built → how it changes → why the route changes</text>
</svg>
