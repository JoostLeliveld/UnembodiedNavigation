gate_id: GATE-ONLINE-EFE
title: Online global EFE reaches the goal in warehouse_full_4cam
status: PASSED
passed_2026_08_18: >-
  logs/visibility_comparison/e0_online_efe_gate_v1/mc_blind_L/C1/seed0. All six
  criteria pass. G1 accepted camera corrections on 818 of 861 timesteps (95%);
  G2 the selected plan ends 0.21 m from the goal with source
  solver:route:availability_blind; G3 zero step-zero clearance rejections;
  G4 arrived 0.121 m from the goal; G5 completion_reason=goal_reached in 36.7 s
  with no collision; G6 minimum fused availability along the EXECUTED path 0.0014,
  against the pilot's 0.9999 — the robot genuinely entered the ground where the
  observation models differ. Two checker bugs were found and fixed by this run:
  G5 tested for 'goal' when the runner emits 'goal_reached', and G1 read
  perception.csv, which was empty despite 818 accepted corrections, so it now
  reads pixel_corr_accepted from experiment.csv.
checker_validated: >-
  2026-08-17. check_gate.py was replayed against the failed 2026-08-15 pilot
  (static_puse_closed_loop_gazebo_v1/route_tall_shadow_west/C1/seed0) and correctly
  returns FAIL on G2 (plan ends 12.89 m from goal), G3 (292 step-zero clearance
  rejections), G4, G5 and G6 (minimum fused availability along the executed path
  0.9999). A gate that has never been shown to fail is not a gate.
blocks: [EXP-AVAIL-CL]
world: warehouse_full_4cam.world.sdf

why: >-
  The paper's closed-loop comparison runs the global EFE planner online rather
  than replaying pre-solved waypoints. The 2026-08-15 pilot could not test its
  scientific variable: all three conditions produced a near-stationary plan,
  executed about one metre, ended roughly 12.9 m from the goal, and tripped the
  20 s stuck detector. The local controller reported
  driveable_clearance_violation_step_0 and safe-stopped. In the corrected
  diagnostic run all three optimizer candidates were properly marked
  goal_feasible=False, and the planner still selected the least-bad infeasible
  warm_or_cold solution.
  Until an online run reaches a goal, no campaign seed may be spent: every arm
  would return "stuck" and the comparison would measure the controller, not the
  observation model.

  CORRECTED 2026-08-17: the start pose was NOT the cause, though an earlier reading
  of this evidence said so. Measured keep-in clearance at that task's start is
  0.550 m against a 0.25 m contract, so the initial pose was legal and the
  "safe start" task variant was not required. The step-zero rejections follow from
  the plan being degenerate rather than the pose being illegal: five waypoints
  spanning 0.66 m leave the local controller no valid first step to track. That is a
  solver-convergence problem, which is also what the cost breakdown says — risk_cost
  59,773 of a 60,066 total for a plan that barely moved.

# Offline pre-flight, run BEFORE any Gazebo launch. Costs seconds and would have
# saved the pilot's three runs.
preflight:
  script: check_task_clearance.py
  checks: >-
    Every campaign task's start pose, goal pose and E3-selected route must clear the
    0.25 m global keep-in contract. A pose or route below it is rejected at step zero
    by the local controller, which is what produced the pilot's 292
    driveable_clearance_violation_step_0 events.
  first_run_2026_08_17: >-
    Start and goal poses passed for all three tasks (0.45-0.82 m). The E3 routes
    FAILED at 0.062 m (mc_blind_L) and 0.005 m (mc_m2_w2e_traverse) because grid
    Dijkstra hugs boundaries; E3 route search was changed to use the mask eroded by
    the contract, and the routes were regenerated.
  rule: >-
    Never lower the clearance threshold to make a task pass. Move the pose inward or
    choose a different task.

# Every criterion is measured from run artifacts, never from a screenshot or a
# subjective read of the trajectory plot.
criteria:
  - id: G1
    name: World and sensing came up
    measure: >-
      detections logged in perception.csv, with more than one camera contributing a
      selected pixel source. perception.csv records the SELECTED source, not every
      camera that fired, so this cannot prove all four streams were healthy.
    pass_if: at least one detection and more than one contributing camera
  - id: G2
    name: A goal-feasible global plan exists
    measure: >-
      global_plan_meta.json terminal_goal_distance_pred, i.e. how far the SELECTED
      global plan ends from the goal, together with rollout_valid. run_summary.json
      carries no feasibility field, and rollout_valid alone is not sufficient: the
      pilot's plans were dynamically valid and ended 12.89 m short of the goal.
    pass_if_max_terminal_pred_m: 0.5
    note: >-
      The pilot's real failure. A planner that selects an infeasible candidate
      must fail this gate rather than be rescued by a longer time limit.
  - id: G3
    name: The controller accepted the plan
    measure: >-
      occurrences of driveable_clearance_violation_step_0 in the campaign's _ros_logs.
      The code is emitted to the ROS text logs, which exist once per campaign rather
      than per run, so this count is campaign-wide. If the logs cannot be found the
      criterion reports N/A and never PASS.
    pass_if: zero occurrences
  - id: G4
    name: The robot arrived
    measure: final distance from belief to the task goal
    pass_if_max_m: 0.5
  - id: G5
    name: It arrived without being rescued by the stuck detector
    measure: run completion_reason
    pass_if: goal
  - id: G6
    name: The route actually entered the region where the arms differ
    measure: >-
      minimum fused p_use along the executed path, evaluated on the frozen
      four-camera field
    pass_if_max: 0.2
    note: >-
      This is the criterion the pilot silently failed even before it got stuck.
      An online run that arrives while staying in well-observed ground proves the
      stack works and still cannot discriminate the observation models, so it
      passes G1-G5 and fails the gate as a whole.

# G1-G5 are run against the availability-blind arm (C1) only. It is the arm with
# the fewest moving parts, so a failure is unambiguously the planner or the
# controller and not the availability field.
gate_arm: C1

on_pass: >-
  Promote EXP-AVAIL-CL from BLOCKED to READY and allocate the matched campaign.
on_fail: >-
  Fix the planner or controller and re-run this single seed. Do not widen the
  clearance, do not relax the terminal goal tolerance, and do not substitute
  pre-solved waypoints: the last of those is the protocol that was explicitly
  not chosen for this paper.
