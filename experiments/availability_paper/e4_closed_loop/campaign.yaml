# E4 — matched closed-loop campaign, online global EFE.
#
# STATUS: GATE PASSED 2026-08-18; CAMPAIGN STOPPED AFTER 12/45 PLAN-BEARING RUNS.
# All persisted mc_blind_L global plans were coordinate-identical, so this frozen
# config is retained as executed provenance and must not be resumed as though the
# preregistered matched campaign were still intact.
#
# Every key below is copied from the 2026-08-15 pilot campaign except the task
# list, the route seeds and ros_domain_id_base. The three arms differ ONLY in the
# planning observation model, so any difference in outcome is attributable to it.

world: warehouse_full_4cam.world.sdf
launch_file: warehouse_primary_comparison.launch.py

conditions:
  C1:
    planner: constant_R_efe
    label: availability_blind_constant_R
    use_hit_miss_mixture: false
  C2:
    planner: visibility_aware_efe
    label: availability_aware_R_over_p
    use_hit_miss_mixture: false
  C3:
    planner: visibility_aware_efe
    label: availability_aware_explicit_hit_miss
    use_hit_miss_mixture: true

# Task selection is not by intuition. E3 measured, on the frozen four-camera field and
# under the 0.25 m keep-in contract, which declared tasks contain a blackspot the
# planner can actually avoid.
#
#   mc_blind_L              blind route holds a 5.60 s unobserved stretch at minimum
#                           availability 0.011 and 64.1% realised hit rate; a 0.16 m
#                           sidestep removes it entirely (0.00 s, 84.1%).
#                           DISCRIMINATING, and the largest effect measured -> primary.
#   route_tall_shadow_west  every availability-aware arm finds a SAME-LENGTH route that
#                           removes a 1.20 s stretch and reaches 100% hit rate. A free
#                           improvement, and a different mechanism from mc_blind_L
#                           (no detour at all) -> second discriminating task.
#   mc_m2_w2e_traverse      every candidate route has minimum availability 0.000; no
#                           route escapes. PRESPECIFIED NEGATIVE CONTROL.
#
# full_traverse_handover is excluded: it never leaves covered ground (0.00 s for every
# arm), so it cannot discriminate and would only add runs.
#
# Registering the negative control in advance is the point: if C2/C3 beat C1 on
# mc_m2_w2e_traverse, where there is nothing to avoid, the effect is not the
# observation model and the campaign has found a confound. Note E3 already found that
# weak availability models make that task WORSE (2.80 s -> 4.00 s), so a C2/C3 loss
# there would not by itself be surprising.
#
# route_tall_shadow_west rather than the _safe_start variant: both clear the keep-in
# contract (0.550 m and 0.815 m at the start), the pilot's failure was not the start
# pose, and this is the variant E3 characterised.
tasks:
  mc_blind_L:
    role: primary_discriminating
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]
    optimizer_route_seed_source: e3_selected_routes.json
  route_tall_shadow_west:
    role: second_discriminating_zero_detour
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]
    optimizer_route_seed_source: e3_selected_routes.json
  mc_m2_w2e_traverse:
    role: prespecified_negative_control
    conditions: [C1, C2, C3]
    seeds: [0, 1, 2, 3, 4]
    optimizer_route_seed_source: e3_selected_routes.json

# 3 tasks x 3 conditions x 5 seeds = 45 runs. The experimental unit is one
# complete navigation run; the paired unit for an arm contrast is (task, seed),
# giving 15 matched pairs per contrast.
design:
  experimental_unit: one complete navigation run
  paired_unit: [task, seed]
  matched_pairs_per_contrast: 15
  primary_endpoint: >-
    Longest continuous interval with no accepted camera correction, in seconds.
    E3 showed why this and not terminal sigma: the belief re-converges once the robot
    leaves a blackspot, so across arms terminal sigma moved 0.6 mm while the longest
    unobserved stretch on mc_blind_L moved 5.60 s -> 0.00 s and the realised detection
    rate along that route moved 64.1% -> 84.1%. Reporting terminal sigma would hide
    the effect entirely.
  secondary_endpoints:
    - belief RMSE against the Gazebo GT bridge
    - fraction of the run with truth outside the stated 95 percent ellipse
    - accepted-correction rate
    - path length and time to goal
    - completion_reason tally
  analysis: >-
    Paired per (task, seed) within each contrast; sign test plus the mean paired
    difference. C1-vs-C2 is the headline contrast. C2-vs-C3 is reported but is
    expected to be small: the runtime precision blend is linear in precision, so
    it already carries the availability-weighted mean information, and both the
    static replay and the E3 route selection put the two within noise of each
    other. A null there is a bounded null, not evidence of no effect.
  stopping_rule: >-
    Run all 45. Do not stop early on a favourable interim, and do not add seeds
    to a task after seeing its result.

