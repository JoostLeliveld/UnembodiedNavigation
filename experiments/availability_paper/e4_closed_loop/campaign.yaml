# Set explicitly, unlike the pilot, whose manifest recorded
# optimizer_terminal_goal_tolerance_m = None. With no tolerance the terminal gate is
# inactive and _terminal_goal_feasible returns True for every candidate, so
# lexicographic selection falls straight through to cost and can pick a plan that
# never reaches the goal -- which is what happened.
optimizer_terminal_goal_tolerance_m: 0.5
stuck_window_s: 20.0

