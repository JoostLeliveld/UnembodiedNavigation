experiment_id: EXP-AVAIL-ROUTE
title: Availability-aware route discrimination and decision regret
status: complete_offline_route_study
claim_ids: [C3]
world: warehouse_full_4cam.world.sdf

question: >-
  Does an availability field change which route is chosen, and does a route chosen
  with a deployable field cost anything against one chosen with a surveyed model?

tasks:
  - mc_blind_L
  - mc_m2_w2e_traverse
  - full_traverse_handover
  - route_tall_shadow_west
task_note: >-
  The same four declared tasks as experiment 11, frozen before any source was
  scored, so the two studies' route numbers are comparable.

candidate_set:
  generation: >-
    Dijkstra on the fused noisy-OR availability field with a reliability penalty,
    swept over nine weights, for each of the five spatial sources; identical
    polylines deduplicated.
  reliability_weights: [0.0, 0.25, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0]
  shared: true
  rationale: >-
    Every source chooses from the SAME candidate set, so an arm can be penalised for
    choosing badly but never for having searched differently.
  known_limitation: >-
    Grid Dijkstra finds a local sidestep out of an occlusion band rather than an
    alternative lane-graph branch. The R1 route archetype in 06_world_camera_design
    section 5 expects a much larger detour, so the R1 binding for mc_blind_L is NOT
    certified by this experiment.

belief_model:
  form: position-only sequential Bernoulli hit/miss mixture
  update: "P <- p_c * (P^-1 + R_c^-1)^-1 + (1 - p_c) * P, per camera in order"
  matches: the position-only case of the runtime's hit_miss_posterior_ca
  dt_s: 0.4
  speed_mps: 0.6
  process_noise_xy: 0.012
  initial_sigma_xy_m: 0.05
  r_cond_source: logs/studies/pixel_ground_path/e7_ipm_zero_parameter/summary.json
  r_cond_arm: raw IPM (floor, no correction)

reference_field:
  source: cad_reference
  caveat: >-
    A CAD raycast requires a surveyed 3-D model. It is the common yardstick for
    scoring every arm's chosen route, not an oracle and not truth. E1 already showed
    a no-survey method matches it on held-out prediction.

endpoints:
  primary: longest continuous unobserved stretch along the selected route, seconds
  low_p_threshold: 0.2
  secondary:
    - exposure, the integral of (1 - p_use) along the route
    - unobserved fraction of the route
    - detour against the explicitly computed shortest driveable path
    - decision regret against the best candidate under the reference field
    - empirical hit rate among real detector events within 0.5 m of the route
  explicitly_not_primary: terminal sigma
  why: >-
    The belief re-converges once the robot leaves a blackspot, so terminal sigma is
    nearly blind to the effect: it moved 0.6 mm across all arms while the longest
    unobserved stretch halved. Registering it would manufacture a null.

model_free_check:
  metric: empirical hit rate among real spawn-grid detections near the route
  why: >-
    Every other endpoint is computed through a model of availability. This one is
    taken straight from real detector outcomes and depends on no field at all.

prespecified_interpretation:
  - A source that predicts well offline may still route badly; predictive skill and
    decision quality are separate results and are reported separately.
  - A task where no candidate escapes the blackspot is a negative control, not a
    failure of the method.

prohibited_interpretation:
  - any closed-loop, navigation or safety reading — that is E4's alone
  - any claim that a route archetype is certified

evaluation_only_inputs: []
assumption_ids: [A02, A11, A14, A15, A17]
reviewer_question_ids: [RQ01, RQ13]
