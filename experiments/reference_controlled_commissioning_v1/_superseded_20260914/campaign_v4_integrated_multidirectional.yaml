analysis_order:
- fit_mean_bias_or_nn_correction_on_fit_drives
- estimate_q_sensor_from_every_camera_opportunity_on_fit_drives
- test_independent_camera_subset_probabilities_against_observed_subsets
- measure_temporal_and_cross_camera_post_correction_residual_dependence
- freeze_support_and_mean_correction_using_development_drives
- compare_R_hit_rungs_last_using_post_correction_residuals
- freeze_complete_sensor_model
- open_audit_partition_once
online_covariance:
  primary_method: one_robot_filter_consuming_each_corrected_camera_frame_once
  double_cascade_role: diagnostic_comparator_only
  preferred_temporal_fallback_order:
  - measured_effective_update_interval
  - augmented_joint_robot_and_persistent_camera_bias_filter
  prohibited_handoff: accumulated_first_filter_posterior_as_fresh_independent_measurement
dependence_quantities:
  R_i: fast_single_frame_residual_covariance
  B_i: persistent_per_camera_bias_covariance_if_required
  C_ij: simultaneous_cross_camera_residual_covariance_if_required
expected_drive_count: 12
pilot_evidence:
  all_drives_passed: true
  drives: 18
  date: '2026-09-12'
replication:
  integrated_sweeps_per_partition: 2
  directions_per_sweep: 2
  replicates_per_route_direction: 1
  note: All missing-area coverage is part of the two continuous sweeps; there are
    no short standalone commissioning drives.
dynamic_coverage_contract:
  continuous_sweeps: 2
  standalone_short_transects: 0
  covered_in_sweeps:
  - outer and interior vertical aisles
  - three eastern cross aisles
  - wide southern aisle at multiple offsets
  - central lower extension
  - northeast perimeter return
  - west, middle and east lower bays
  turnaround_policy: U-shaped bay loops and a narrow northeast loop; no instantaneous
    180-degree waypoint reversal
  direction_policy: each complete sweep forward and reverse
  role_shift_policy: corridor-aware lateral paths; adjacent roles differ by 0.15 m
    except where a larger safe-endpoint envelope is required
