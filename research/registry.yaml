  - {id: SQ3, title: "How should it influence planning?", status: LOCKED}
  - {id: SQ4, title: "What deployment trade-offs exist?", status: LOCKED}

claims:
  - id: C1
    question_id: SQ1
    statement: Availability alone is insufficient to characterize observation quality.
    status: LOCKED
  - id: C2
    question_id: SQ2
    statement: Reliability methods form three operational families with different information requirements and failure modes.
    status: READY
  - id: C3
    question_id: SQ3
    statement: Explicit observation-quality modelling can change predicted belief and route choice.
    status: READY
  - id: C4
    question_id: SQ3
    statement: Better observation models improve navigation only where observation quality changes the achievable belief.
    status: BLOCKED
  - id: C5
    question_id: SQ4
    statement: Camera management should be evaluated separately from observation-quality estimation.
    status: READY
  - id: C6
    question_id: SQ4
    statement: Different operational regimes favour different estimator families.
    status: PLANNED

assumptions:
  - {id: A01, title: Commissioned camera calibration is available; drift is bounded or monitored., status: TESTED}
  - {id: A02, title: The operational floor is locally planar for ground-point projection., status: ACCEPTED}
  - {id: A03, title: Camera intrinsics optics resolution and timing are fixed within an arm., status: ACCEPTED}
  - {id: A04, title: Geometry provenance distinguishes static mapped depth from live sensed depth., status: ACCEPTED}
  - {id: A05, title: Unknown or missing depth invokes an explicit conservative fallback., status: ACCEPTED}
  - {id: A06, title: Static and dynamic occluders are reported as separate regimes., status: DEFERRED}
  - {id: A07, title: Lighting and real-image domain transfer are outside current claims., status: DEFERRED}
  - {id: A08, title: Detector weights and confidence threshold are frozen within comparisons., status: ACCEPTED}
  - {id: A09, title: Robot dimensions and appearance are fixed and documented., status: ACCEPTED}
  - {id: A10, title: One robot removes multi-target association ambiguity., status: ACCEPTED}
  - {id: A11, title: Heading is odometry-backed and camera updates correct 2-D position., status: ACCEPTED}
  - {id: A12, title: Timestamp synchronization and latency are measured operational inputs., status: TESTED}
  - {id: A13, title: Camera errors may be temporally persistent and mutually correlated., status: TESTED}
  - {id: A14, title: Evidence is simulation-only and supports no hardware-deployment claim., status: ACCEPTED}
  - {id: A15, title: Evaluation truth is unavailable to all deployed interfaces., status: ACCEPTED}
  - {id: A16, title: Four cameras provide geometric and residual-structure diversity but not optical archetype diversity., status: ACCEPTED}
  - {id: A17, title: Candidate-pose grid and target height are frozen and shared across compared arms., status: ACCEPTED}
  - {id: A18, title: Commissioning budgets count unique sites rather than repeated frames., status: ACCEPTED}
  - {id: A19, title: Splits use preregistered grouping appropriate to the estimand., status: ACCEPTED}
  - {id: A20, title: Pixel statistic and inversion plane form one coupled measurement choice., status: ACCEPTED}

