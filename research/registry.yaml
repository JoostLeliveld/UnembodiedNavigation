    archive_rule: >-
      Preserve the fold table, the paired contrasts, the per-fold GP predictions, the
      spatial-block definition, the route table and the selected polylines
      permanently. The prediction numbers are meaningless without the blocks that
      produced them, and E4 seeds its planner from the polylines.
    next_action: >-
      The two-world governance blocker is CLOSED: that rule was retired 2026-08-20,
      so a source comparison run in warehouse_full_4cam needs no exception. The F07
      contract now treats CAD as a surveyed
      reference baseline rather than an assumed upper bound: monocular depth ties the
      CAD raycast on paired held-out Brier (difference 0.0060, better in 8 of 24 folds,
      sign test p 0.15). Three sub-results, all complete. E1: a Gaussian process
      with no geometric mean function barely beats the constant baseline on ground it
      has not seen, so the geometry carries the prediction. E2: geometry predicts
      availability at rank correlation 0.82 to 0.84 and conditional error at only
      0.10 to 0.23, and the most-available camera is not the most accurate at 42.2
      percent of positions covered by two or more cameras, which rebuilds the
      EXP-PRECISION mechanism on current inputs without any per-camera-versus-pooled
      R_cond claim. E3, under the 0.25 m keep-in contract: on mc_blind_L a
      0.16 m sidestep removes the blind route's 5.60 s unobserved stretch entirely and
      lifts the realised hit rate from 64.1 to 84.1 percent, while terminal sigma moves
      0.6 mm across arms, so terminal sigma must never be a closed-loop endpoint. The
      effect is confined to two tasks of four, which is why the 2026-08-15 pilot could
      not discriminate. WITHDRAWN by the clearance fix: the claim that a weak
      availability field routes WORSE than ignoring availability, which was an artifact
      of boundary-hugging routes; distance-only and FOV/range now tie the blind
      baseline at 2.40 s and are worse only on the negative-control task. NEW: the
      benefit depends on camera PLACEMENT rather than count, two opposing cameras
      giving the largest saving of any configuration (3.40 s) and two on the same wall
      the smallest (1.50 s) despite a worse blind baseline. NEW LIMITATION: prediction
      parity is not decision parity, since monocular depth ties the CAD raycast on
      held-out Brier yet spends an equal-length detour in the wrong place on
      mc_blind_L and stays exposed 4.80 s against CAD's 0.00 s.
      The R1 route archetype binding for mc_blind_L is NOT certified: measured detour
      is about 2 percent against the roughly 27 percent in 06_world_camera_design
      section 5, because the candidate set is grid Dijkstra rather than lane-graph
      enumeration. E3 route search was corrected on 2026-08-17 to run on the driveable
      mask eroded by the 0.25 m global keep-in contract: the previous version searched
      the raw binary mask, which has no clearance term, and selected routes with
      0.062 m and 0.005 m minimum clearance that the local controller would reject at
      step zero and that E4 would have seeded its planner from. The erosion keeps
      64.9 percent of the floor and leaves every task connected at 0.293 to 0.458 m.

  - experiment_id: EXP-AVAIL-CL
    title: Matched closed-loop campaign, availability-blind versus availability-aware
    study_path: experiments/availability_paper/e4_closed_loop
    status: BLOCKED
    claim_ids: [C3, C4]
    assumption_ids: [A01, A08, A10, A11, A12, A13, A14, A15]
    reviewer_question_ids: [RQ11, RQ13]
    figure_ids: [F06]
    dependencies: [ASSET-RUNTIME, ASSET-PLANNER, ASSET-CAMPAIGN]
    operational_inputs: [camera_measurements, odometry_belief, frozen_availability_field, conditional_covariance]
    operational_interface_inputs: [camera_measurements, odometry_belief, frozen_availability_field, conditional_covariance]
    evaluation_only_inputs: [ground_truth_pose, contact_events, nees]
    primary_metric: longest continuous interval with no accepted camera correction
    promotion_gate: >-
      GATE-ONLINE-EFE must pass on one availability-blind seed first: a goal-feasible
      online plan, no step-zero clearance rejection, arrival within 0.5 m without the
      stuck detector, AND an executed path that enters ground where the arms differ.
    evidence_paths:
      - experiments/availability_paper/e4_closed_loop/campaign.yaml
      - experiments/availability_paper/e0_online_efe_readiness/gate.yaml
      - logs/studies/availability_paper/e5_offline_efe_solve/e5_offline_efe_solve.csv
      - logs/studies/availability_paper/e6_offline_map_plan_audit/summary.json
      - logs/studies/availability_paper/figures/11_offline_map_vs_solved_routes.png
      - logs/studies/availability_paper/figures/12_p_maps_in_planning.png
    archive_rule: >-
      Preserve every run ledger, summary, provenance record and null result,
      including runs that fail the gate.
    next_action: >-
      GATE-ONLINE-EFE PASSED 2026-08-18 on mc_blind_L C1 seed 0: goal reached in
      36.7 s, 0.121 m final error, no collision, 818 of 861 timesteps with an
      accepted camera correction, and minimum fused availability 0.0014 along the
      executed path, so the run entered ground where the arms differ. E4 then stopped
      after 12 of 45 plan-bearing mc_blind_L runs; one additional C3 attempt ended
      before persisting a plan. All 12 global_plan.csv files contain the same 76
      coordinates (14.88 m; maximum pointwise difference 0.0 m). E5 reproduces the
      route-selection consensus for all three tasks and shows that the ambiguity term
      changes with availability but is dominated by risk and obstacle costs. Do not
      resume this frozen campaign or report an arm-level navigation comparison from
      the incomplete set. Preregister a new planner formulation, and require an
      offline runtime-objective sensitivity gate that produces a route difference,
      before allocating another closed-loop campaign.

