tasks:
  warehouse_v2.world.sdf: &warehouse_v2_tasks
  - name: thesis10_camera_a_western_dock_detour
    description: Three-route western dock traverse testing the detour induced by removing camera A.
    start: {x: -10.7, y: 8.55, z: 0.05, yaw: 0.0}
    goal: {x: -7.6, y: -8.5}
    route_seeds:
    - name: west_south_crossing
      waypoints: [[-10.7, -6.25], [-7.6, -6.25], [-7.6, -8.5]]
    - name: west_lower_crossing
      waypoints: [[-10.7, -5.75], [-7.6, -5.75], [-7.6, -8.5]]
    - name: west_middle_aisle
      waypoints: [[-6.95, 8.55], [-6.95, -8.5], [-7.6, -8.5]]
  - name: thesis10_camera_b_cross_warehouse_detour
    description: Three cross-warehouse routes testing the detour induced by removing camera C (B/C dropout swap, 2026-09-26). The start faces north where cameras B, C and E see the robot, so the removal arms can confirm the start belief. The goal is the first point on its lane (x = 0.975, scanned south from the former goal (0.975, 8.625)) that a camera other than C sees in at least 90% of the captured views within 0.75 m (task-visibility rule, pipeline/check_task_visibility.py).
    start: {x: -7.6, y: -7.5, z: 0.05, yaw: 1.5708}
    goal: {x: 0.975, y: 7.25}
    route_seeds:
    - name: south_crossing
      waypoints: [[-7.6, -6.25], [0.975, -6.25], [0.975, 7.25]]
    - name: lower_crossing
      waypoints: [[-7.6, -5.75], [0.975, -5.75], [0.975, 7.25]]
    - name: middle_aisle_north
      waypoints: [[-6.95, -7.5], [-6.95, 8.625], [0.975, 8.625], [0.975, 7.25]]
  - name: thesis10_camera_c_inner_warehouse_detour
    description: Two equal-length routes testing the detour induced by removing camera B (B/C dropout swap, 2026-09-26). The middle aisle (x = -3.05) is seen by camera B only; the covered alternative runs east along the top lane and down the x = 0.975 lane. Start and goal were chosen by pipeline/search_dropout_tasks.py (2026-09-27) so that every model prefers the aisle with all cameras and only an information difference can move the choice; both pass the task-visibility rule without camera B.
    start: {x: -3.05, y: 8.625, z: 0.05, yaw: -1.5708}
    goal: {x: 0.975, y: -5.75}
    route_seeds:
    - name: middle_aisle
      waypoints: [[-3.05, -5.75], [0.975, -5.75]]
    - name: north_east_lanes
      waypoints: [[0.975, 8.625], [0.975, -5.75]]
  - name: thesis10_camera_e_eastern_detour
    description: Three equal-length eastern routes testing the local detour induced by removing camera E.
    start: {x: 10.6, y: -1.175, z: 0.05, yaw: 3.1416}
    goal: {x: 0.975, y: 8.625}
    route_seeds:
    - name: main_aisle
      waypoints: [[0.975, -1.175], [0.975, 8.625]]
    - name: middle_connector
      waypoints: [[10.6, 2.425], [0.975, 2.425], [0.975, 8.625]]
    - name: upper_crossing
      waypoints: [[10.6, 6.35], [0.975, 6.35], [0.975, 8.625]]
  - name: thesis10_camera_e_long_cross_warehouse_detour
    description: Three long cross-warehouse routes testing the detour induced by removing camera E.
    start: {x: -10.7, y: 8.55, z: 0.05, yaw: 0.0}
    goal: {x: 9.6, y: -1.4}
    route_seeds:
    - name: main_aisle
      waypoints: [[0.975, 8.55], [0.975, -1.175], [9.6, -1.175], [9.6, -1.4]]
    - name: middle_connector
      waypoints: [[0.975, 8.55], [0.975, 2.425], [9.925, 2.425], [9.925, -1.4], [9.6, -1.4]]
    - name: upper_crossing
      waypoints: [[0.975, 8.55], [0.975, 6.35], [10.675, 6.35], [10.675, -1.4], [9.6, -1.4]]
